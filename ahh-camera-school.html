<style>
.sim-layout{display:grid;gap:16px}
@media(min-width:800px){.sim-layout{grid-template-columns:minmax(0,1.3fr) minmax(240px,.7fr);align-items:start}}
.sim-stage{background:var(--navy-deep);border-radius:14px;padding:12px;border:1px solid var(--line)}
.sim-stage canvas{width:100%;height:auto;display:block;border-radius:8px;background:#101820}
.sim-readout{margin:10px 0 0;text-align:center}
.sim-readout .readout{font-size:1.05rem}
.slider-row{display:grid;gap:6px;margin:0 0 14px}
.slider-row input[type=range]{width:100%;accent-color:var(--brass);min-height:44px}
.check-form,.quiz-form{display:grid;gap:12px}
.check-ticks{list-style:none;margin:8px 0;padding:0}
.check-ticks li{margin:2px 0}
.choice{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.choice input{width:1.2rem;height:1.2rem;margin-top:.25rem}
fieldset.question{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0;background:var(--paper)}
textarea,input[type=text],input[type=number],input[type=file],select{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;width:100%;min-height:44px}
textarea{min-height:88px;resize:vertical}
.pass{color:var(--good);font-weight:700}
.warn{color:var(--warn);font-weight:700}
.thumb{width:160px;max-width:100%;height:auto;border-radius:8px;display:block;background:#111}
.evidence-group{margin:0 0 22px}
.cheat-sheet{max-width:210mm;margin:0 auto;background:#fff;color:#111;border:1px solid #222;padding:14mm 16mm;box-shadow:var(--shadow)}
.cheat-sheet h3,.cheat-sheet h4,.cheat-sheet p,.cheat-sheet li{color:#111;font-family:"Source Sans 3",sans-serif}
.cheat-sheet h3{font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;margin:0 0 8px;font-size:1.8rem}
.cheat-sheet h4{font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;margin:16px 0 6px;border-bottom:2px solid #111;padding-bottom:3px}
.cheat-sheet ul{margin:0;padding-left:1.1rem}
.cheat-sheet li{margin:.2rem 0}
.locked{opacity:.85}
@page{size:A4;margin:12mm}
@media print{
  .no-print{display:none!important}
  .cheat-sheet{box-shadow:none;border:0;max-width:none;padding:0}
  .cheat-sheet,.cheat-sheet h3,.cheat-sheet h4,.cheat-sheet p,.cheat-sheet li{color:#000!important;background:#fff!important}
  .evidence-report,.evidence-report h3,.evidence-report h4,.evidence-report p,.evidence-report li{color:#000!important}
  .sim-stage,canvas{break-inside:avoid}
  body[data-print="sheet"] .masthead,
  body[data-print="sheet"] .tabs,
  body[data-print="sheet"] footer,
  body[data-print="sheet"] .page-head,

<script>
(() => {
'use strict';
const CONFIG = { name: 'AHH Camera School', storageKey: 'ahh-full-tier-state', storageSubKey: 'cameraSchool', sourceApp: 'camera-school' };
const toolLabels = {
  'gear-map': 'Gear map',
  modes: 'Modes',
  lessons: 'Lessons',
  quiz: 'Quiz',
  simulator: 'Simulator',
  'photo-check': 'Photo check',
  'cheat-sheet': 'Cheat sheet',
  'fact-register': 'Fact register'
};
const knownTools = new Set(Object.keys(toolLabels));
const allCards = [JSON.parse(document.getElementById('camera-card').textContent)];
const APERTURES = [1.4, 2, 2.8, 4, 5.6, 8, 11, 16, 22];
const APPROVED_AREAS = ['English','Mathematics','Science','HASS','Technologies','The Arts','Health and Physical Education','Languages'];
const state = { tab:'Home', cardId:null, tool:'overview', gearView:'top', hotspot:null, sim:null, quizLevel:null, picks:{}, check:null, reflection:'', studentName:'' };
const app = document.getElementById('app');
const tabsEl = document.getElementById('tabs');
document.getElementById('appName').textContent = CONFIG.name;

function readAll(){try{return JSON.parse(localStorage.getItem(CONFIG.storageKey)||'{}');}catch(_){return {};}}
function readPrefs(){try{return readAll()[CONFIG.storageSubKey]||{};}catch(_){return {};}}
function writePrefs(patch){try{const all=readAll();const current=all[CONFIG.storageSubKey]||{};all[CONFIG.storageSubKey]={...current,...patch};localStorage.setItem(CONFIG.storageKey,JSON.stringify(all));return true;}catch(_){return false;}}
const prefs=readPrefs();
if(prefs.large) document.body.classList.add('large');
state.studentName=prefs.studentName||'';

function previewOn(){return /(^|#)preview\b/.test(location.hash||'');}
function cardVisible(c){if(!c||!c.status) return false; if(c.status==='live') return true; if(c.status==='draft') return previewOn(); return false;}
function visibleCards(){return allCards.filter(cardVisible);}
function currentCard(){return visibleCards().find(c=>c.id===state.cardId)||null;}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function factById(card,id){return (card.facts||[]).find(f=>f.id===id);}
function factSource(card,id){const f=factById(card,id);return f?`<span class="source">Source: <a href="#fact-${esc(id)}" data-fact="${esc(id)}">${esc(f.source)}</a></span>`:'';}
function factLinks(card,ids){return (ids||[]).map(id=>factSource(card,id)).filter(Boolean).join('<br>');}

function tabs(){
  const categories=[...new Set(visibleCards().map(c=>c.category))].sort((a,b)=>a.localeCompare(b,'en-AU'));
  const list=['Home',...categories,'My Evidence','Glossary'];
  tabsEl.innerHTML=list.map(t=>`<button class="tab" role="tab" aria-selected="${state.tab===t}" data-tab="${esc(t)}">${t==='Home'?'⌂ ':''}${esc(t)}</button>`).join('');
}
function pageHead(title,sub=''){return `<div class="page-head"><div><h2>${esc(title)}</h2>${sub?`<p class="muted">${esc(sub)}</p>`:''}</div></div>`;}
function cameraSvg(){return `<svg viewBox="0 0 220 120" role="img" aria-label="Simple camera outline"><path d="M28 36h37l10-13h48l10 13h35a10 10 0 0 1 10 10v49a10 10 0 0 1-10 10H28a10 10 0 0 1-10-10V46a10 10 0 0 1 10-10Z" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="111" cy="69" r="27" fill="none" stroke="currentColor" stroke-width="5"/><circle cx="111" cy="69" r="17" fill="none" stroke="currentColor" stroke-width="2"/><path d="M38 50h17M156 49h12" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>`;}
function gearButton(c,blurb){return `<button class="gear-card" data-open-card="${esc(c.id)}"><div class="camera-mark">${cameraSvg()}</div><span class="pill">${esc(c.category)} · ${esc(c.group)}</span><h3>${esc(c.name)}</h3><p class="muted">${esc(c.subtitle)}</p><p>${blurb}</p><span class="accent" style="display:inline-block;padding:7px 12px;border-radius:8px">Open gear card →</span></button>`;}

function renderHome(){
  const cards=visibleCards();
  const list=cards.length?`<div class="grid">${cards.map(c=>gearButton(c,'Explore the camera, learn the modes and try your first photo.')).join('')}<div class="panel"><h3>Built for practical learning</h3><p>Short explanations, real controls and simple missions help connect the lesson to the camera in your hands.</p><p class="muted">More cards can be added by supplying card data. Category tabs are created from the cards.</p></div></div>`:`<div class="panel"><p>No gear cards to show yet.</p></div>`;
  const notice=cards.length?`<div class="notice"><strong>Start here</strong><br>Choose a gear card to explore its controls, camera modes and first lesson.</div>`:'';
  app.innerHTML=pageHead('Welcome','A practical place to learn camera controls and build confidence.')+notice+`<h3 class="section-title">Your gear</h3>`+list;
}
function renderCategory(){
  const cards=visibleCards().filter(c=>c.category===state.tab);
  app.innerHTML=pageHead(state.tab,'Gear cards are grouped by maker or collection.')+(cards.length?`<div class="grid">${cards.map(c=>gearButton(c,'Open card →')).join('')}</div>`:'<div class="panel"><p>No gear cards to show yet.</p></div>');
}

function toolButtons(card){
  const tools=[['overview','Overview'],...card.tools.filter(id=>knownTools.has(id)).map(id=>[id,toolLabels[id]])];
  return `<div class="toolrow" role="toolbar" aria-label="Card tools">${tools.map(([id,label])=>`<button data-tool="${id}" aria-pressed="${state.tool===id}">${label}</button>`).join('')}</div>`;
}
function renderCard(){
  const card=currentCard();
  if(!card){state.cardId=null;state.tab='Home';renderHome();return;}
  const specs=card.specs.map(s=>{const readout=s.label==='ISO'||s.label==='Shutter';return `<div class="spec"><small>${esc(s.label)}</small><strong${readout?' class="readout"':''}>${esc(s.value)}</strong>${factSource(card,s.factId)}</div>`;}).join('');
  const extra=(card.safetyExtra||[]).map(line=>`<li>${esc(line)}</li>`).join('');
  app.innerHTML=pageHead(`${card.group} ${card.name}`,`${card.subtitle} · ${card.category}`)+`<div class="spec-grid">${specs}</div>${toolButtons(card)}<div id="toolContent" class="content"></div><section class="panel safety"><h3>Use your gear safely</h3><ul><li>Never look at the sun through a viewfinder, lens or telescope.</li><li>Look after the gear: strap on, cap on, keep it dry.</li><li>Ask before photographing people, and ask a parent before sharing photos online.</li><li>Be sun smart outdoors.</li>${extra}</ul></section>`;
  renderTool();
}
function renderTool(){
  const el=document.getElementById('toolContent');
  if(!el) return;
  const card=currentCard();
  if(!card) return;
  document.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tool===state.tool)));
  if(state.tool==='gear-map') el.innerHTML=renderGearMap(card);
  else if(state.tool==='modes') el.innerHTML=renderModes(card);
  else if(state.tool==='lessons') el.innerHTML=renderLessons(card);
  else if(state.tool==='quiz') el.innerHTML=renderQuiz(card);
  else if(state.tool==='simulator') el.innerHTML=renderSimulator(card);
  else if(state.tool==='photo-check') el.innerHTML=renderPhotoCheck(card, lessonForGoal(card), true);
  else if(state.tool==='cheat-sheet') el.innerHTML=renderCheatSheet(card);
  else if(state.tool==='fact-register') el.innerHTML=renderFacts(card);
  else el.innerHTML=`<div class="panel"><h3>Ready to learn</h3><p>Choose a tool above to get started.</p></div>`;
  afterPaint();
}
function renderGearMap(card){
  const view=card.gearMap.views.find(v=>v.id===state.gearView)||card.gearMap.views[0];
  const hot=view.hotspots;
  const selected=hot.find(h=>h.id===state.hotspot)||hot[0];
  return `<h3>Gear map</h3><p class="muted">Use the controls list while checking the physical camera.</p><div class="gear-tabs">${card.gearMap.views.map(v=>`<button data-view="${esc(v.id)}" aria-pressed="${v.id===view.id}">${esc(v.label)}</button>`).join('')}</div><div class="map-placeholder"><div><svg viewBox="0 0 430 170" aria-label="${esc(view.label)}"><rect x="65" y="24" width="300" height="120" rx="15" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="215" cy="84" r="43" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="215" cy="84" r="28" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="112" cy="47" r="12" fill="none" stroke="#C9A24A" stroke-width="3"/><circle cx="326" cy="47" r="12" fill="none" stroke="#C9A24A" stroke-width="3"/><text x="215" y="160" fill="currentColor" font-size="12" text-anchor="middle">${esc(view.label)} · not to scale</text></svg><p class="muted">No copied manufacturer artwork is used.</p></div></div><div class="hotspots">${hot.map(h=>`<button class="${selected&&selected.id===h.id?'active':''}" data-hotspot="${esc(h.id)}">${esc(h.label)}</button>`).join('')}</div>${selected?`<div class="panel" style="margin-top:12px"><h3>${esc(selected.label)}</h3><p>${esc(selected.text)}</p>${factLinks(card,selected.factIds)}</div>`:''}`;
}
function renderModes(card){
  return `<h3>Camera modes</h3><p class="muted">Choose a mode name to understand what the camera controls.</p><div class="mode-list">${card.modes.map(m=>`<article class="mode-card"><div class="mode-code">${esc(m.code)}</div><h4>${esc(m.name)}</h4><p>${esc(m.text)}</p>${factLinks(card,m.factIds)}</article>`).join('')}</div>`;
}
function lessonForGoal(card){return (card.lessons||[])[0]||null;}
function renderLessons(card){
  const lessons=card.lessons||[];
  if(!lessons.length) return `<div class="panel"><p>No lessons are on this card yet.</p></div>`;
  const l=lessons[0];
  const goalLine=goalSentence(l.do&&l.do.goal);
  return `<h3>Lesson 1 · ${esc(l.title)}</h3><p class="muted">${esc(l.level)}</p><div class="grid"><section class="lesson-step"><div class="step-number">01 · Teach</div><h3>Get ready</h3><p>${esc(l.teach.text)}</p>${factLinks(card,l.teach.factIds)}</section><section class="lesson-step"><div class="step-number">02 · Show</div><h3>Find the control</h3><p>Open the gear map and select the highlighted control. Match it to your own camera before moving on.</p><button class="primary" data-show-tool>Open ${esc(toolLabels[l.show&&l.show.tool]||'tool')}</button></section><section class="lesson-step mission"><div class="step-number">03 · Do</div><h3>Your mission</h3><p>${esc(l.do.mission)}</p><p><strong>Goal:</strong> ${esc(goalLine)}</p>${renderPhotoCheck(card,l,false)}</section></div><details><summary>Parent notes</summary><p>${esc(l.parentNotes||'')}</p></details>`;
}

function goalSentence(goal){
  if(!goal) return 'Follow the mission on this card.';
  if(goal.all) return 'Meet every part of this mission.';
  if(goal.type==='any-photo') return 'Take one photo with this camera.';
  if(goal.type==='mode') return `Use ${goal.mode}.`;
  if(goal.type==='shutter-faster') return `Use a shutter speed of ${goal.value} or faster.`;
  if(goal.type==='shutter-slower') return `Use a shutter speed of ${goal.value} or slower.`;
  if(goal.type==='aperture-wider') return `Use an aperture of f/${goal.value} or wider.`;
  if(goal.type==='aperture-narrower') return `Use an aperture of f/${goal.value} or narrower.`;
  if(goal.type==='iso-max') return `Use ISO ${goal.value} or lower.`;
  return 'Follow the mission on this card.';
}

function parseShutter(value){
  if(value==null||value==='') return null;
  if(typeof value==='number' && isFinite(value)) return value;
  const s=String(value).trim().toLowerCase();
  if(!s||s==='bulb') return null;
  if(s.endsWith('sec')) return parseShutter(s.replace(/sec(onds)?/,'').trim());
  if(s.includes('/')){const [a,b]=s.split('/'); const n=Number(a), d=Number(b); return d?n/d:null;}
  const n=Number(s); return isFinite(n)?n:null;
}
function formatShutter(seconds){
  if(seconds==null||!isFinite(seconds)) return '';
  if(seconds>=1){const rounded=Math.round(seconds*10)/10; return (Number.isInteger(rounded)?String(rounded):rounded.toFixed(1))+' sec';}
  return '1/'+Math.max(1,Math.round(1/seconds));
}
function formatAperture(n){if(n==null||!isFinite(Number(n))) return ''; const v=Number(n); return 'f/'+(Number.isInteger(v)?String(v):String(Math.round(v*10)/10));}
function readoutLine(info){
  const parts=[];
  if(info.aperture!=null) parts.push(formatAperture(info.aperture));
  if(info.shutter!=null) parts.push(formatShutter(info.shutter));
  if(info.iso!=null) parts.push('ISO '+info.iso);
  return parts.join(' · ');
}
function shutterStops(slowest,fastest){
  const slow=parseShutter(slowest), fast=parseShutter(fastest);
  const standard=[30,15,8,4,2,1,1/2,1/4,1/8,1/15,1/30,1/60,1/125,1/250,1/500,1/1000,1/2000,1/4000,1/8000];
  if(slow==null||fast==null||slow<fast) return [1/125];
  const list=standard.filter(s=>s<=slow*1.01 && s+1e-9>=fast);
  if(!list.length) return [slow,fast];
  if(Math.abs(list[0]-slow)/slow>0.05) list.unshift(slow);
  if(Math.abs(list[list.length-1]-fast)/fast>0.05) list.push(fast);
  return list;
}
function ensureSim(card){
  const sim=card.simulator||{};
  const stops=shutterStops(sim.shutterSlowest||'30', sim.shutterFastest||'1/8000');
  if(!state.sim || state.sim.cardId!==card.id){
    const isoMin=Number(sim.isoMin??100), isoMax=Number(sim.isoMax??6400);
    let iso=200; if(iso<isoMin) iso=isoMin; if(iso>isoMax) iso=isoMin;
    let sh=stops.findIndex(s=>s<=1/125); if(sh<0) sh=Math.floor(stops.length/2);
    state.sim={cardId:card.id, ap:APERTURES.indexOf(5.6), sh, iso};
  }
  state.sim.stops=stops;
  return state.sim;
}
function renderSimulator(card){
  const sim=ensureSim(card);
  const isoMin=Number((card.simulator||{}).isoMin??100), isoMax=Number((card.simulator||{}).isoMax??6400);
  const f=APERTURES[sim.ap]||5.6;
  const sec=sim.stops[sim.sh];
  return `<h3>Simulator</h3><p class="muted">Move aperture, shutter and ISO. Aperture blurs the background, a slower shutter smooths the water, and ISO adds grain. Brightness follows all three. ISO and shutter ends come from this card.</p><div class="sim-layout"><div class="sim-stage"><canvas id="simCanvas" width="560" height="840" role="img" aria-label="Sample showing aperture, shutter and ISO"></canvas><p class="sim-readout"><span class="readout">${esc(formatAperture(f))} · ${esc(formatShutter(sec))} · ISO ${esc(sim.iso)}</span></p></div><div class="panel"><div class="slider-row"><label for="simAp">Aperture <span class="readout">${esc(formatAperture(f))}</span></label><input id="simAp" data-sim="ap" type="range" min="0" max="${APERTURES.length-1}" step="1" value="${sim.ap}"></div><div class="slider-row"><label for="simSh">Shutter <span class="readout">${esc(formatShutter(sec))}</span></label><input id="simSh" data-sim="sh" type="range" min="0" max="${sim.stops.length-1}" step="1" value="${sim.sh}"></div><div class="slider-row"><label for="simIso">ISO <span class="readout">ISO ${esc(sim.iso)}</span></label><input id="simIso" data-sim="iso" type="range" min="${isoMin}" max="${isoMax}" step="100" value="${sim.iso}"></div>${factLinks(card,(card.simulator||{}).factIds)}</div></div>`;
}

const scene={ready:false,failed:false,bufs:{}};
function sceneBuf(name,w,h){
  let c=scene.bufs[name];
  if(!c){c=document.createElement('canvas'); scene.bufs[name]=c;}
  if(c.width!==w||c.height!==h){c.width=w; c.height=h;}
  return c;
}
function loadScene(){
  const load=src=>new Promise((res,rej)=>{const img=new Image(); img.onload=()=>res(img); img.onerror=()=>rej(new Error('scene')); img.src=src;});
  Promise.all([load(SCENE_SRC.bg),load(SCENE_SRC.tree),load(SCENE_SRC.water)]).then(([bg,tree,water])=>{
    scene.bg=bg; scene.tree=tree; scene.water=water; scene.ready=true;
    const c=document.getElementById('simCanvas'); if(c) drawSim(c);
  }).catch(()=>{scene.failed=true;});
}
function simLook(){
  const sim=state.sim;
  const f=APERTURES[sim.ap]||5.6;
  const sec=sim.stops[sim.sh]||1/125;
  const iso=Number(sim.iso)||200;
  const ev=Math.log2((5.6*5.6)/(f*f))+Math.log2((1/125)/sec)+Math.log2(iso/200);
  const bright=Math.max(0.35, Math.min(1.8, Math.pow(2, ev*0.35)));
  const dof=Math.max(0,(8-f)*1.7);
  const slow=Math.log2(sec/(1/500));
  const waterBlur=slow<=0?0:Math.min(16, slow*1.15);
  return {f,sec,iso,bright,dof,waterBlur};
}
function addGrain(ctx,w,h,iso){
  const amount=Math.max(0,(iso-100)/6400);
  if(amount<0.02) return;
  const img=ctx.getImageData(0,0,w,h);
  const d=img.data;
  const amp=amount*48;
  for(let i=0;i<d.length;i+=4){
    const n=(Math.random()-0.5)*2*amp;
    d[i]=Math.max(0,Math.min(255,d[i]+n));
    d[i+1]=Math.max(0,Math.min(255,d[i+1]+n));
    d[i+2]=Math.max(0,Math.min(255,d[i+2]+n));
  }
  ctx.putImageData(img,0,0);
}
function drawFallback(canvas){
  const w=canvas.width, h=canvas.height;
  const ctx=canvas.getContext('2d');
  const {bright,dof}=simLook();
  ctx.clearRect(0,0,w,h);
  ctx.save();
  ctx.filter=`blur(${Math.min(dof,6).toFixed(2)}px) brightness(${bright.toFixed(2)})`;
  const sky=ctx.createLinearGradient(0,0,0,h*0.62);
  sky.addColorStop(0,'#8ea4bf'); sky.addColorStop(1,'#d5deea');
  ctx.fillStyle=sky; ctx.fillRect(0,0,w,h*0.62);
  ctx.fillStyle='#6d7c6a'; ctx.fillRect(0,h*0.55,w,h*0.45);
  ctx.fillStyle='#31455c'; ctx.beginPath(); ctx.moveTo(0,h*0.58); ctx.lineTo(w*0.28,h*0.34); ctx.lineTo(w*0.46,h*0.58); ctx.fill();
  ctx.fillStyle='#24364c'; ctx.beginPath(); ctx.moveTo(w*0.32,h*0.58); ctx.lineTo(w*0.62,h*0.28); ctx.lineTo(w*0.9,h*0.58); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.filter=`brightness(${bright.toFixed(2)})`;
  ctx.fillStyle='#1b2f4b'; ctx.fillRect(w*0.56,h*0.46,w*0.14,h*0.3);
  ctx.fillStyle='#c9a24a'; ctx.fillRect(w*0.72,h*0.58,w*0.09,h*0.18);
  ctx.restore();
  addGrain(ctx,w,h,state.sim.iso);
}
function drawPhotoSim(canvas){
  const bg=scene.bg, tree=scene.tree, water=scene.water;
  const w=bg.naturalWidth, h=bg.naturalHeight;
  if(canvas.width!==w||canvas.height!==h){canvas.width=w; canvas.height=h;}
  const {bright,dof,waterBlur,iso}=simLook();
  const plate=sceneBuf('plate',w,h);
  const pctx=plate.getContext('2d');
  pctx.setTransform(1,0,0,1,0,0);
  pctx.globalCompositeOperation='source-over';
  pctx.filter='none';
  pctx.clearRect(0,0,w,h);
  pctx.drawImage(bg,0,0);
  if(waterBlur>0.3){
    const wt=sceneBuf('water',w,h);
    const wctx=wt.getContext('2d');
    wctx.setTransform(1,0,0,1,0,0);
    wctx.globalCompositeOperation='source-over';
    wctx.clearRect(0,0,w,h);
    wctx.filter=`blur(${waterBlur.toFixed(2)}px)`;
    wctx.drawImage(bg,0,0);
    wctx.filter='none';
    wctx.globalCompositeOperation='destination-in';
    wctx.drawImage(water,0,0);
    wctx.globalCompositeOperation='source-over';
    pctx.drawImage(wt,0,0);
  }
  const ctx=canvas.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,w,h);
  ctx.save();
  ctx.filter=`blur(${dof.toFixed(2)}px) brightness(${bright.toFixed(3)})`;
  ctx.drawImage(plate,0,0);
  ctx.restore();
  ctx.save();
  ctx.filter=`brightness(${bright.toFixed(3)})`;
  ctx.drawImage(tree,0,0);
  ctx.restore();
  addGrain(ctx,w,h,iso);
}
function drawSim(canvas){
  const card=currentCard(); if(!card||!state.sim) return;
  if(scene.ready) drawPhotoSim(canvas);
  else drawFallback(canvas);
}

function programToCode(program){
  const map={'manual':'M','normal program':'P','aperture priority':'Av','shutter priority':'Tv','creative program':'CA','action program':'Tv','portrait mode':'Portrait','landscape mode':'Landscape','not defined':''};
  return map[String(program||'').toLowerCase()]||'';
}
function numberFrom(value){
  if(value==null||value==='') return null;
  if(typeof value==='number' && isFinite(value)) return value;
  if(Array.isArray(value)) return numberFrom(value[0]);
  const n=Number(value); return isFinite(n)?n:null;
}
async function readExif(file){
  if(!file || typeof exifr==='undefined' || !exifr.parse) return {hasExif:false};
  try{
    const data=await exifr.parse(file,{tiff:true,exif:true,iptc:false,xmp:false,icc:false,mergeOutput:true,translateValues:true,reviveValues:true});
    if(!data) return {hasExif:false};
    const model=data.Model||data.model||'';
    const shutter=numberFrom(data.ExposureTime);
    const aperture=numberFrom(data.FNumber);
    const iso=numberFrom(data.ISO||data.ISOSpeedRatings);
    const program=typeof data.ExposureProgram==='string'?data.ExposureProgram:'';
    const hasExif=!!(model||shutter!=null||aperture!=null||iso!=null||program);
    return {hasExif, model:String(model||''), program, mode:programToCode(program), shutter, aperture, iso};
  }catch(_){return {hasExif:false};}
}
function normModel(s){return String(s||'').replace(/\0/g,'').trim().toLowerCase().replace(/\s+/g,' ');}
function modelMatches(card, model){
  const names=(card.exif&&card.exif.modelMatch)||[];
  const typed=normModel(model);
  if(!typed) return false;
  return names.some(n=>normModel(n)===typed);
}
function matchedModelName(card, model){
  const names=(card.exif&&card.exif.modelMatch)||[];
  const typed=normModel(model);
  return names.find(n=>normModel(n)===typed)||model;
}
function checkLabel(card, goal, info){
  if(!goal) return '';
  if(goal.type==='any-photo') return 'Taken on a '+matchedModelName(card, info.model);
  if(goal.type==='mode') return 'Exposure mode '+goal.mode;
  if(goal.type==='shutter-faster') return 'Shutter speed '+goal.value+' or faster';
  if(goal.type==='shutter-slower') return 'Shutter speed '+goal.value+' or slower';
  if(goal.type==='aperture-wider') return 'Aperture f/'+goal.value+' or wider';
  if(goal.type==='aperture-narrower') return 'Aperture f/'+goal.value+' or narrower';
  if(goal.type==='iso-max') return 'ISO '+goal.value+' or lower';
  return '';
}
function passedChecks(card, goal, info){
  const lines=[];
  (function walk(g){
    if(!g) return;
    if(Array.isArray(g.all)){g.all.forEach(walk); return;}
    if(checkGoal(card, g, info).ok){const label=checkLabel(card, g, info); if(label) lines.push(label);}
  })(goal);
  return lines;
}
function modeMatches(card, goalMode, info){
  const goal=String(goalMode||'').trim().toLowerCase();
  const accepted=new Set([goal]);
  const found=(card.modes||[]).find(m=>String(m.code).toLowerCase()===goal||String(m.name).toLowerCase()===goal);
  if(found){accepted.add(String(found.code).toLowerCase()); accepted.add(String(found.name).toLowerCase());}
  const aliases={'m':'manual','manual exposure':'manual','p':'normal program','program ae':'normal program','av':'aperture priority','aperture-priority ae':'aperture priority','tv':'shutter priority','shutter-priority ae':'shutter priority','ca':'creative program','creative auto':'creative program','b':'bulb','bulb':'bulb','full auto':'full auto'};
  if(aliases[goal]) accepted.add(aliases[goal]);
  const got=[info.mode, info.program].filter(Boolean).map(v=>String(v).trim().toLowerCase());
  return got.some(v=>accepted.has(v));
}
function checkGoal(card, goal, info){
  if(!goal) return {ok:false, missing:false, reason:'No mission goal is on this card.'};
  if(Array.isArray(goal.all)){
    const parts=goal.all.map(g=>checkGoal(card,g,info));
    const bad=parts.find(p=>!p.ok);
    return bad||{ok:true, missing:false, reason:''};
  }
  if(goal.type==='any-photo'){
    if(!info.model) return {ok:false, missing:true, reason:'The camera model was not in the photo.'};
    return modelMatches(card, info.model)?{ok:true, missing:false, reason:''}:{ok:false, missing:false, reason:'This photo is not from the camera on this card.'};
  }
  if(goal.type==='mode'){
    if(!info.mode && !info.program) return {ok:false, missing:true, reason:'The exposure mode was not in the photo.'};
    return modeMatches(card, goal.mode, info)?{ok:true, missing:false, reason:''}:{ok:false, missing:false, reason:'The exposure mode does not match this mission.'};
  }
  if(goal.type==='shutter-faster' || goal.type==='shutter-slower'){
    if(info.shutter==null) return {ok:false, missing:true, reason:'The shutter speed was not in the photo.'};
    const target=parseShutter(goal.value);
    if(target==null) return {ok:false, missing:false, reason:'This mission goal has no shutter speed to check.'};
    const ok=goal.type==='shutter-faster'?info.shutter<=target+1e-9:info.shutter+1e-9>=target;
    return {ok, missing:false, reason:ok?'':'The shutter speed does not match this mission.'};
  }
  if(goal.type==='aperture-wider' || goal.type==='aperture-narrower'){
    if(info.aperture==null) return {ok:false, missing:true, reason:'The aperture was not in the photo.'};
    const target=Number(goal.value);
    const ok=goal.type==='aperture-wider'?info.aperture<=target:info.aperture>=target;
    return {ok, missing:false, reason:ok?'':'The aperture does not match this mission.'};
  }
  if(goal.type==='iso-max'){
    if(info.iso==null) return {ok:false, missing:true, reason:'The ISO was not in the photo.'};
    const ok=info.iso<=Number(goal.value);
    return {ok, missing:false, reason:ok?'':'The ISO is higher than this mission allows.'};
  }
  return {ok:false, missing:false, reason:'This mission goal is not one this page can check.'};
}

    ? '<p><strong>Hint:</strong> Screenshots and some shared photos lose their settings. Try the original file from the camera\'s card.</p>'
    : (lesson&&lesson.do&&lesson.do.hint?`<p><strong>Hint:</strong> ${esc(lesson.do.hint)}</p>`:'');
  const manual=result.missing?manualFields(info):'';
  return `<div class="panel"><p class="warn">${esc(result.reason||'Those settings do not match this mission yet.')}</p>${hand}${modelBit}${modeBit}${line?`<p class="readout">${esc(line)}</p>`:''}${hint}${manual}</div>`;
}

async function runCheck(file, manualInfo){
  const card=currentCard(); if(!card) return;
  const lesson=lessonForGoal(card);
  const goal=lesson&&lesson.do&&lesson.do.goal;
  let info=manualInfo;
  let thumb=state.check&&state.check.thumb;
  if(file){

    thumb=await resizePhoto(file);
    if(!info.hasExif) info={hasExif:false, model:'', mode:'', program:'', shutter:null, aperture:null, iso:null};
  }
  if(!info) info={hasExif:false};
  let result;
  if(file && !info.hasExif && !manualInfo) result={ok:false, missing:true, reason:'This photo has no settings data.'};
  else result=checkGoal(card, goal, info);
  if(result.ok) result.checks=passedChecks(card, goal, info);
  state.check={info, result, thumb, lessonId:lesson&&lesson.id, fileName:file?file.name:''};

function infoFromManual(base){
  const read=name=>{const el=document.querySelector(`[data-manual="${name}"]`); return el?el.value.trim():'';};
  const mode=read('mode');
  const shutter=parseShutter(read('shutter'));
  const aperture=numberFrom(read('aperture').replace(/^f\//i,''));
  const iso=numberFrom(read('iso'));
  return {hasExif:true, byHand:true, model:read('model')||(base&&base.model)||'', mode, program:mode, shutter, aperture, iso};
}
function resizePhoto(file){
  return new Promise(resolve=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      const max=800; let w=img.naturalWidth||800, h=img.naturalHeight||600;
      const scale=Math.min(1, max/Math.max(w,h));
      w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
      const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve({dataUrl:canvas.toDataURL('image/jpeg',0.75), width:w, height:h, mimeType:'image/jpeg'});
    };
    img.onerror=()=>{URL.revokeObjectURL(url); resolve(null);};
    img.src=url;
  });
}

function localStamp(d){
  const pad=n=>String(n).padStart(2,'0');
  const off=-d.getTimezoneOffset();
  const sign=off>=0?'+':'-';
  const abs=Math.abs(off);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${sign}${pad(Math.floor(abs/60))}:${pad(abs%60)}`;
}
function localDate(d){const pad=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function newId(prefix){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);}
function curriculumFromCard(card){
  return (card.curriculumLinks||[]).map(link=>{
    const area=String(link.area||'').trim();
    if(!APPROVED_AREAS.includes(area)) return null;
    const path=Array.isArray(link.path)?link.path.map(String):[];
    const label=[area,...path].join(' > ');
    return {kind:link.kind&&link.kind!=='learningArea'?link.kind:'learningArea', area, ...(path.length?{path}:{}), label};
  }).filter(Boolean).slice(0,10);
}

function renderQuiz(card){
  const blocks=card.quiz||[];
  const levels=card.levels&&card.levels.length?card.levels:(blocks.map(b=>b.level));
  if(!state.quizLevel || !levels.includes(state.quizLevel)) state.quizLevel=levels[0]||(blocks[0]&&blocks[0].level)||'';
  const open=unlockedSet(card);
  const tabs=levels.map(level=>`<button type="button" data-quiz-level="${esc(level)}" aria-pressed="${state.quizLevel===level}" ${open.has(level)?'':'disabled'}>${esc(level)}</button>`).join('');
  if(!open.has(state.quizLevel)){
    const prev=levels[Math.max(0, levels.indexOf(state.quizLevel)-1)];
    return `<h3>Quiz</h3><div class="toolrow">${tabs}</div><div class="panel locked"><p>Pass ${esc(prev||'the previous level')} to open ${esc(state.quizLevel)}.</p></div>`;
  }
  const block=blocks.find(b=>b.level===state.quizLevel);
  const questions=block&&block.questions||[];
  if(!questions.length) return `<h3>Quiz</h3><div class="toolrow">${tabs}</div><div class="panel"><p>No questions for this level.</p></div>`;
  const pass=typeof block.passMark==='number'?block.passMark:0.8;
  const fields=questions.map((q,i)=>`<fieldset class="question"><legend>${esc(q.q)}</legend>${q.options.map((opt,j)=>`<label class="choice"><input type="radio" name="q${i}" data-quiz-pick="${i}" value="${j}" ${String(state.picks[i])===String(j)?'checked':''}> <span>${esc(opt)}</span></label>`).join('')}${factLinks(card,q.factIds)}</fieldset>`).join('');
  const result=state.quizResult&&state.quizResult.level===state.quizLevel?`<p class="${state.quizResult.passed?'pass':'warn'}">${esc(state.quizResult.text)}</p>`:'';
  return `<h3>Quiz</h3><p class="muted">Pass mark ${Math.round(pass*100)}%.</p><div class="toolrow">${tabs}</div><form class="quiz-form" data-quiz-form>${fields}<button class="primary" type="submit">Check answers</button>${result}</form>`;
}
function gradeQuiz(card){
  const block=(card.quiz||[]).find(b=>b.level===state.quizLevel);
  if(!block) return;
  const questions=block.questions||[];
  let correct=0;
  questions.forEach((q,i)=>{if(Number(state.picks[i])===Number(q.answer)) correct++;});
  const pass=typeof block.passMark==='number'?block.passMark:0.8;
  const score=questions.length?correct/questions.length:0;
  const passed=score+1e-9>=pass;
  const levels=card.levels||[];
  const idx=levels.indexOf(block.level);
  let extra='';
  if(passed && idx>=0 && levels[idx+1]){
    const prefsNow=readPrefs();
    const unlocked=Object.assign({}, prefsNow.unlocked||{});
    const have=new Set(unlocked[card.id]||[]);
    if(levels[0]) have.add(levels[0]);
    have.add(levels[idx+1]);
    unlocked[card.id]=[...have];
    const results=Object.assign({}, prefsNow.quizResults||{});
    results[card.id]=Object.assign({}, results[card.id]||{}, {[block.level]:{correct, total:questions.length, passed:true}});
    writePrefs({unlocked, quizResults:results});
    extra=` ${levels[idx+1]} is now open.`;
  }else{
    const prefsNow=readPrefs();
    const results=Object.assign({}, prefsNow.quizResults||{});
    results[card.id]=Object.assign({}, results[card.id]||{}, {[block.level]:{correct, total:questions.length, passed}});
    writePrefs({quizResults:results});
  }
  state.quizResult={level:block.level, passed, text: passed?`${correct} of ${questions.length}. That's a pass.${extra}`:`${correct} of ${questions.length}. Not a pass yet. The pass mark is ${Math.round(pass*100)}%.`};
  renderTool();
}

function exportEvidence(){
  const status=document.getElementById('exportStatus');
  const nameEl=document.getElementById('studentName');
  const raw=nameEl?nameEl.value.trim():'';
  if(!raw){if(status) status.textContent='Add a first name before you download.'; return;}
  if(/\s/.test(raw)){if(status) status.textContent='Use a first name only, with no surname.'; return;}
  if(raw.length>60){if(status) status.textContent='Use a shorter first name.'; return;}
  state.studentName=raw;
  const prefsNow=readPrefs();
  const studentId=prefsNow.studentId||newId('s');
  writePrefs({studentName:raw, studentId});
  const entries=evidenceEntries();
  const dates=entries.map(e=>e.date).filter(Boolean).sort();
  const from=dates[0]||localDate(new Date());
  const to=dates[dates.length-1]||from;
  const file={
    format:'wattlewood-evidence',
    formatVersion:'1.0',
    exportedAt:localStamp(new Date()),
    source:{app:CONFIG.sourceApp, appName:CONFIG.name},
    student:{name:raw, sourceStudentId:studentId},
    entries:entries.map(entry=>{
      const card=allCards.find(c=>c.id===entry.cardId);
      const curriculum=card?curriculumFromCard(card):[];
      const types=[{type:'workSample', note:entry.lessonTitle||'Lesson'}];
      if(entry.photo) types.push({type:'photo', note:'Photo from the mission'});
      if(entry.reflection) types.push({type:'reflection'});
      const photos=[];
      if(entry.photo&&entry.photo.dataUrl){
        photos.push({photoId:entry.photoId|| (CONFIG.sourceApp+':'+newId('p')), caption:entry.lessonTitle||'', mimeType:'image/jpeg', size:'standard', width:entry.photo.width, height:entry.photo.height, dataUrl:entry.photo.dataUrl});
      }
      const out={
        entryId:entry.entryId,
        date:entry.date,
        title:String(entry.title||'Lesson').slice(0,120),
        summary:String(entry.summary||entry.mission||'Lesson').slice(0,2000),
        description:String(entry.description||entry.mission||'').slice(0,2000),
        reflection:entry.reflection?String(entry.reflection).slice(0,1000):undefined,
        curriculum,
        evidenceTypes:types.slice(0,6),
        photos:photos.length?photos:undefined,
        parentComment:entry.parentComment||undefined,
        tags:[entry.cardName, entry.level].filter(Boolean).map(t=>String(t).slice(0,30)).slice(0,10),
        createdAt:entry.createdAt,
        updatedAt:entry.updatedAt
      };
      Object.keys(out).forEach(k=>{if(out[k]===undefined) delete out[k];});
      return out;
    })
  };
  const json=JSON.stringify(file,null,2);
  if(json.length>25*1024*1024){if(status) status.textContent='This file is too big to export. Remove a photo and try again.'; return;}
  const safe=raw.replace(/[^A-Za-z0-9]+/g,'')||'Child';
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`${safe}_${CONFIG.sourceApp}_${from}_to_${to}.wwevidence.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  if(status) status.textContent='Evidence file downloaded.';
}

function glossaryItems(cards){
  const items=[];
  function add(term, factIds){
    const name=String(term??'').trim(); if(!name) return;
    const key=name.toLocaleLowerCase('en-AU');
    let item=items.find(x=>x.key===key);
    if(!item){item={key, term:name, factIds:[], card:null}; items.push(item);}
    (factIds||[]).forEach(id=>{if(id && !item.factIds.includes(id)) item.factIds.push(id);});
  }
  cards.forEach(card=>{
    (card.specs||[]).forEach(s=>add(s.label, s.factId?[s.factId]:[]));
    (card.modes||[]).forEach(m=>add(m.name, m.factIds||[]));
    (((card.gearMap||{}).views)||[]).forEach(v=>(v.hotspots||[]).forEach(h=>add(h.label, h.factIds||[])));
    items.forEach(item=>{if(!item.card) item.card=card;});
  });
  return items;
}
function renderGlossary(){
  const cards=visibleCards();
  const articles=glossaryItems(cards).slice().sort((a,b)=>a.term.localeCompare(b.term,'en-AU')).map(item=>{
    const card=item.card;
    const facts=item.factIds.map(id=>factById(card,id)).filter(Boolean);
    if(!facts.length) return '';
    return `<article class="panel"><h3>${esc(item.term)}</h3>${facts.map(f=>`<p>${esc(f.statement)}</p>`).join('')}${item.factIds.map(id=>factSource(card,id)).join('<br>')}</article>`;
  }).join('');
  app.innerHTML=pageHead('Glossary','Terms from the gear cards, each with the fact behind it.')+(articles?`<div class="grid">${articles}</div>`:'<p>No terms to show yet.</p>');
}

  if(e.target.dataset.sim==='ap') sim.ap=Number(e.target.value);
  if(e.target.dataset.sim==='sh') sim.sh=Number(e.target.value);
  if(e.target.dataset.sim==='iso') sim.iso=Number(e.target.value);
  const canvas=document.getElementById('simCanvas');
  if(canvas){
    drawSim(canvas);
    const f=APERTURES[sim.ap]||5.6;
    const sec=sim.stops[sim.sh];
    const readout=document.querySelector('.sim-readout .readout');
    if(readout) readout.textContent=`${formatAperture(f)} · ${formatShutter(sec)} · ISO ${sim.iso}`;
    const apLabel=document.querySelector('label[for="simAp"] .readout');
    const shLabel=document.querySelector('label[for="simSh"] .readout');
    const isoLabel=document.querySelector('label[for="simIso"] .readout');
    if(apLabel) apLabel.textContent=formatAperture(f);
    if(shLabel) shLabel.textContent=formatShutter(sec);
    if(isoLabel) isoLabel.textContent='ISO '+sim.iso;
  }
});
document.addEventListener('input', e=>{if(e.target && e.target.dataset && e.target.dataset.reflection!=null) state.reflection=e.target.value;});

function syncThemeButton(){const dark=document.documentElement.classList.contains('dark'); document.getElementById('themeBtn').textContent=dark?'Light mode':'Dark mode'; const meta=document.querySelector('meta[name="theme-color"]'); if(meta) meta.setAttribute('content', dark?'#0B1524':'#0E1B2E');}
document.getElementById('themeBtn').addEventListener('click', ()=>{const next=!document.documentElement.classList.contains('dark'); document.documentElement.classList.add('theme-set'); document.documentElement.classList.toggle('dark', next); writePrefs({dark:next}); syncThemeButton();});
document.getElementById('largeBtn').addEventListener('click', ()=>{document.body.classList.toggle('large'); const large=document.body.classList.contains('large'); document.getElementById('largeBtn').setAttribute('aria-pressed', String(large)); writePrefs({large});});
const scheme=window.matchMedia('(prefers-color-scheme: dark)');
function onScheme(){if(document.documentElement.classList.contains('theme-set')) return; document.documentElement.classList.toggle('dark', scheme.matches); syncThemeButton();}
if(scheme.addEventListener) scheme.addEventListener('change', onScheme); else if(scheme.addListener) scheme.addListener(onScheme);
syncThemeButton();
document.getElementById('largeBtn').setAttribute('aria-pressed', String(document.body.classList.contains('large')));
})();

</script>
</body>
</html>
