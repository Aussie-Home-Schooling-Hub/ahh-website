E1 Triple Zero (000). "Triple Zero (000) is Australia's main emergency service number. Call 000 if you need urgent help from police, fire or ambulance. The operator asks 'Emergency. Police, Fire or Ambulance?' Stay calm, speak clearly, and stay on the line."
Sources: https://www.acma.gov.au/emergency-calls (search-index copy; direct fetch blocked). https://www.infrastructure.gov.au/media-communications/phone/triple-zero/how-call-triple-zero-000 (search-index copy; direct fetch blocked). Status: Confirmed.

E1a Interpreters. "If a person is unable to speak English they should still dial 000. The operator will arrange for an interpreter."
Sources: https://data.esa.act.gov.au/about-esa/emergency-communications-centre/triple-zero-000 and https://www.sa.gov.au/topics/emergencies-and-safety/emergency-phone-numbers (search-index copy; direct fetch blocked). Status: Confirmed.

E2 112. "112 can only be dialled on a mobile phone, and reaches the same Triple Zero (000) service. It can't be called from a landline."
Sources: https://www.acma.gov.au/emergency-calls (search-index copy; direct fetch blocked). https://www.infrastructure.gov.au/media-communications/phone/triple-zero (search-index copy; direct fetch blocked). Status: Confirmed.

E3 Press 55. "If a 000 caller doesn't respond, the call goes to an automated system that asks them to press 55 if they need emergency help. If they don't press 55 after being asked three times, the call is disconnected. Pressing 55 connects them to police, who will try to call back and might send a patrol car."
Source: https://www.acma.gov.au/emergency-calls (search-index copy; direct fetch blocked). Status: Confirmed.

E4 106. "106 is a text-based emergency number for people who are deaf, or who have a hearing or speech impairment. It can only be used with a teletypewriter (TTY), through the National Relay Service. The National Relay Service also has other ways to reach 000." No other option is named.
Sources: https://www.acma.gov.au/emergency-calls (search-index copy; direct fetch blocked). https://www.infrastructure.gov.au/media-communications/phone/triple-zero (search-index copy; direct fetch blocked). Status: Confirmed.

E5 Australian Warning System. "Advice warnings are yellow: an incident has started, there is no immediate danger, stay up to date. Watch and Act warnings are orange: conditions are changing and you need to start taking action now. Emergency Warnings are red: the highest level; you may be in danger and need to take action immediately. The system is used for bushfire, severe weather, flood, cyclone and extreme heat."
Sources: https://www.disaster.qld.gov.au/watch-for-the-warnings and https://www.nsw.gov.au/emergency/get-ready/warnings/warning-system. Status: Confirmed.

E6 UHF CB. "UHF CB channels 5 and 35 may only be used during an emergency or a natural disaster, or for an emergency services response. Using them is not a substitute for calling Triple Zero, and emergency services organisations do not monitor them."
Source: https://www.legislation.gov.au/F2025L01088/asmade/2025-09-15/text/original/epub/OEBPS/document_1/document_1.html Status: Corrected (do not monitor).

E7 No test calls. "Non-emergency calls to Triple Zero (000) take up operators' time when they are needed for genuine, life-threatening emergencies. Save Triple Zero for saving lives." The never-call-to-practise rule stays as well.
Sources: https://pfes.nt.gov.au/newsroom/2011/non-emergency-calls-clog-triple-zero-phone-lines and https://www.esa.act.gov.au/contact-us. Status: Confirmed.

E8 SES, Senior fact case only. "State and territory SES volunteers help in floods and storms. For help that isn't life-threatening, call your state or territory SES on 132 500, the number used in most states and territories. If anyone is trapped, injured or in danger, call 000." No states are listed.
Sources: https://www.ses.sa.gov.au/132500/ https://dfes.wa.gov.au/hazard-information/storm/during https://www.ses.tas.gov.au/ https://pfes.nt.gov.au/emergency-service https://www.esa.act.gov.au/contact-us Status: Confirmed.

E9 Emergency kit. "Emergency kit lists include a battery-powered radio, a torch, spare batteries, a first-aid kit, non-perishable food and drinking water. A battery radio gets weather updates even if the internet and power stop working. One list says to pack 10 litres of drinking water per person at a minimum, for three days."
Sources: https://www.getready.qld.gov.au/emergencykit and https://www.rfs.nsw.gov.au/plan-and-prepare/prepare-your-family/emergency-survival-kit Status: Confirmed.

<style>
:root {
  --navy: #1b2a4a;
  --gold: #e3a823;
  --cream: #fbf6ec;
  --blue: #2a6fb0;
  --card: #fffdf8;
  --green: #1d7a46;
  --green-bg: #e5f6ec;
  --orange: #b8611a;
  --orange-bg: #fff1e4;
  --line: #e4d7c3;
  --display: "Baloo 2", "Nunito", "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif;
  --body: "Nunito Sans", "Nunito", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--cream);
  color: var(--navy);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.45;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { font-family: var(--display); line-height: 1.2; margin: 0 0 8px; }
p { margin: 0 0 8px; }
.screen { min-height: 100vh; }
.top {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  background: var(--navy);
  color: #fff;
  padding: 10px 12px;
}
.brand { flex: 1 1 180px; min-width: 0; }
.hollow { display: block; color: var(--gold); font-size: 13px; letter-spacing: 0.04em; }
.mod { display: block; font-family: var(--display); font-size: 22px; }
.badges, .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.badge {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  max-width: 100%;
  border: 1px solid var(--gold);
  color: var(--gold);
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 15px;
}
.btn, .choice, .bin, .chip, .call-card {
  min-height: 44px;
  min-width: 44px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 14px;
  border-radius: 12px;
  border: 2px solid transparent;
  background: var(--blue);
  color: #fff;
  text-align: center;
}
.btn.gold { background: var(--gold); color: var(--navy); }
.btn.quiet { background: transparent; color: var(--navy); border-color: var(--navy); }
.top .btn.quiet { color: #fff; border-color: #fff; }
main { padding: 12px; max-width: 1040px; margin: 0 auto; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-top: 6px solid var(--blue);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
}
.scene {
  background: linear-gradient(#d7e6f5, #fbf6ec);
  border-radius: 16px;
  padding: 12px;
  margin-bottom: 12px;
}
.room {
  position: relative;
  height: 168px;
  background: #f4efe4;
  border-radius: 12px;
  overflow: hidden;
}
.window-pane {
  position: absolute;
  right: 16px;
  top: 14px;
  width: 72px;
  height: 52px;
  background: #cfe3f6;
  border: 4px solid #fff;
}
.map-frame {
  position: absolute;
  left: 16px;
  top: 16px;
  width: 92px;
  min-height: 44px;
  background: #fff;
  border: 3px solid var(--blue);
  border-radius: 8px;
  font-size: 13px;
  padding: 6px;
}
.desk {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 48px;
  background: #c4a574;
}
.practice-phone {
  position: absolute;
  left: 130px;
  bottom: 28px;
  width: 52px;
  height: 78px;
  background: var(--navy);
  border-radius: 10px;
  box-shadow: 0 0 18px 6px rgba(42, 111, 176, 0.55);
}
.practice-phone span {
  display: block;
  width: 34px;
  height: 42px;
  margin: 8px auto 0;
  background: #d7e6f5;
  border-radius: 4px;
}
.radio-set {
  position: absolute;
  right: 28px;
  bottom: 34px;
  width: 70px;
  height: 36px;
  background: #4d6270;
  border-radius: 8px;
}
.radio-set i {
  position: absolute;
  left: 30px;
  top: -18px;
  width: 4px;
  height: 18px;
  background: #4d6270;
  font-style: normal;
}
.tracks { display: grid; gap: 8px; }
@media (min-width: 720px) {
  .tracks { grid-template-columns: 1fr 1fr; }
}
.track {
  width: 100%;
  text-align: left;
  background: #fff;
  color: var(--navy);
  border: 2px solid var(--blue);
  border-radius: 14px;
  padding: 12px;
  min-height: 44px;
}
.track.on { background: var(--blue); color: #fff; }
.safety, .drawer, .ziggy {
  border-radius: 12px;
  padding: 8px 12px;
  margin: 8px 0;
}
.safety { background: #eef4fb; border-left: 4px solid var(--blue); }
.drawer { background: #fff7e8; border: 1px dashed var(--gold); }
.ziggy { display: flex; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--line); }
.case-grid { display: grid; gap: 12px; }
@media (min-width: 800px) {
  .case-grid { grid-template-columns: 1fr 1fr; align-items: start; }
}
.tracker { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
.hs { width: 36px; height: 36px; }
.board { display: grid; gap: 8px; }
.call-card {
  width: 100%;
  text-align: left;
  background: #fff;
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;
}
.call-card.done { border-color: var(--green); }
.choice, .bin {
  display: flex;
  width: 100%;
  text-align: left;
  margin: 8px 0;
  padding: 10px 12px;
  border-radius: 12px;
  border: 2px solid var(--blue);
  background: #fff;
  color: var(--navy);
}
.bins { display: grid; grid-template-columns: 1fr; gap: 8px; }
@media (min-width: 720px) {
  .bins.two { grid-template-columns: 1fr 1fr; }
  .bins.three { grid-template-columns: 1fr 1fr 1fr; }
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex;
  align-items: center;
  max-width: 100%;
  padding: 8px 12px;
  border-radius: 999px;
  border: 2px solid var(--blue);
  background: #fff;
  color: var(--navy);
  white-space: normal;
  text-align: left;
}
.chip.on { background: var(--blue); color: #fff; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.swatch {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  min-width: 44px;
  padding: 8px 12px;
  border-radius: 10px;
  font-weight: 700;
}
.swatch.yellow { background: #f3d36b; color: var(--navy); }
.swatch.orange { background: #f0a04b; color: var(--navy); }
.swatch.red { background: #8f2d2d; color: #fff; }
.watch {
  font-family: var(--display);
  font-size: 40px;
  margin: 8px 0;
}
.tip { border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
.tip.good { background: var(--green-bg); border: 2px solid var(--green); }
.tip.retry { background: var(--orange-bg); border: 2px solid var(--orange); }
.again { color: var(--orange); font-weight: 800; font-size: 22px; }
.burst { text-align: center; margin-bottom: 8px; }
.tick { font-size: 42px; color: var(--green); }
.burst.pop { animation: pop 0.35s ease; }
@keyframes pop { from { transform: scale(0.92); opacity: 0.4; } to { transform: none; opacity: 1; } }
.hint { background: #fff6dc; border-radius: 12px; padding: 8px 12px; }
.msg { min-height: 1.2em; font-weight: 700; }
.ladder, .wall { display: flex; flex-wrap: wrap; gap: 8px; }
.ladder span, .wall article {
  min-height: 44px;
  padding: 8px 12px;
  border-radius: 12px;
  background: #fff;
  border: 2px solid var(--line);
}
.ladder span { display: inline-flex; align-items: center; }
.wall article { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
.wall article p { margin: 0; }
.ladder .now { border-color: var(--gold); background: #fff6dc; font-weight: 800; }
.cert {
  border: 3px solid var(--gold);
  border-radius: 16px;
  padding: 16px;
  background: #fff;
  text-align: center;
  margin: 12px 0;
}
.privacy { font-size: 16px; }
.map { width: 100%; height: auto; background: #e7f2ea; border-radius: 12px; }
.leave {
  position: fixed;
  inset: 0;
  background: rgba(27, 42, 74, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 5;
}
.leave[hidden] { display: none !important; }
.leave-card {
  background: var(--cream);
  border-radius: 16px;
  padding: 16px;
  width: min(100%, 420px);
}
.phone-face {
  width: min(100%, 280px);
  margin: 8px auto;
  background: var(--navy);
  color: #fff;
  border-radius: 28px;
  padding: 16px;
}
.phone-screen {
  background: #d7e6f5;
  color: var(--navy);
  border-radius: 12px;
  min-height: 88px;
  padding: 10px;
  margin-bottom: 10px;
}
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.key {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  background: #fff;
  color: var(--navy);
  border-radius: 10px;
}
.print-sheet, .phone-sheet { display: none; }
.print-sheet table, .phone-sheet table { width: 100%; border-collapse: collapse; }
.print-sheet td, .print-sheet th { border: 1px solid #bbb; padding: 6px; vertical-align: top; text-align: left; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
@media print {
  .screen { display: none !important; }
  .no-print, button, nav, input, select, textarea { display: none !important; }
  .print-sheet { display: block !important; color: #111; background: #fff; padding: 16px; }
  .phone-sheet { display: none !important; }
  body.printing-phone .print-sheet { display: none !important; }
  body.printing-phone .phone-sheet { display: block !important; color: #111; background: #fff; padding: 16px; }
}
button:focus-visible, .chip:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}
[hidden] { display: none !important; }
input[type="text"], textarea {
  display: block;
  width: 100%;
  max-width: 100%;
  min-height: 44px;
  padding: 10px 12px;
  border: 2px solid var(--navy);
  border-radius: 12px;
  background: #fff;
  margin: 4px 0 8px;
}
label { font-weight: 700; }
.overflow-wrap, p, td, .choice, .chip, .call-card { overflow-wrap: anywhere; }
</style>

  function el(tag, attrs, kids) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (key) {
      if (key === "text") node.textContent = attrs[key];
      else if (key === "class") node.className = attrs[key];
      else node.setAttribute(key, attrs[key]);
    });
    (kids || []).forEach(function (kid) {
      if (kid == null) return;
      node.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
    });
    return node;
  }
  function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); }
  function svg(name, attrs) {
    var node = document.createElementNS("http://www.w3.org/2000/svg", name);
    Object.keys(attrs || {}).forEach(function (key) { node.setAttribute(key, attrs[key]); });
    return node;
  }
  function shuffle(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  }
  function isoOffset(d) {
    var off = -d.getTimezoneOffset();
    var sign = off >= 0 ? "+" : "-";
    var abs = Math.abs(off);
    return localDate(d) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()) + sign + pad(Math.floor(abs / 60)) + ":" + pad(abs % 60);
  }

  function blip(freq) {
    if (!audioOn) return;
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === "suspended") audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";

    var list = el("ul");
    PARENT_PROMPTS.forEach(function (line) { list.appendChild(el("li", { text: line })); });
    grown.appendChild(list);
    grown.appendChild(el("p", { text: "Family challenge: Check your household emergency kit together." }));
    grown.appendChild(el("p", { text: "You can share a photo of the fridge card with the address covered, the Calm call handled certificate, and the printed shift report. No faces, and no address." }));
    var safe = safetyNodes(null);
    if (safe) grown.appendChild(safe);
    grown.appendChild(el("p", { text: REAL_LINE }));
    if (state.track !== "senior") grown.appendChild(el("p", { text: ZIGGY_LINE }));
    main.appendChild(grown);
    renderReport();
  }
  function abandon() {
    killWatch();
    state.cases = [];
    state.results = [];
    state.caseIndex = -1;
    state.view = null;
    state.reflection = "";
    state.started = 0;
    state.createdAt = null;
    state.updatedAt = null;
    hideLeave();
    renderOpen();
  }
  document.getElementById("menu").addEventListener("click", function () {
    if (state.screen === "summary" || state.screen === "open") {
      abandon();
      return;
    }
    document.getElementById("leave").hidden = false;
  });
  document.getElementById("stay").addEventListener("click", hideLeave);
  document.getElementById("go").addEventListener("click", abandon);
  document.getElementById("sound").addEventListener("click", function () {
    audioOn = !audioOn;
    var btn = document.getElementById("sound");
    btn.textContent = audioOn ? "Sound on" : "Sound off";
    btn.setAttribute("aria-pressed", audioOn ? "true" : "false");
    if (audioOn) blip(523);
  });
  window.addEventListener("beforeprint", function () {
    if (document.body.classList.contains("printing-phone")) renderPhoneSheet();
    else renderReport();
  });
  window.addEventListener("afterprint", function () {
    document.body.classList.remove("printing-phone");
  });
  renderPhoneSheet();
  renderOpen();
})();
</script>
</body>
</html>
