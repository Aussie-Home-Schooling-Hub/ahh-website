<link rel="icon" type="image/svg+xml" sizes="any" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233E2717'/%3E%3Cpath d='M13 54 Q24 40 36 27' stroke='%237A8B4A' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3Cellipse cx='17' cy='38' rx='9' ry='4' transform='rotate(-40 17 38)' fill='%237A8B4A'/%3E%3Ccircle cx='40' cy='23' r='14' fill='%23E8C877'/%3E%3Ccircle cx='25' cy='42' r='8' fill='%23C9A24B'/%3E%3Ccircle cx='47' cy='45' r='7' fill='%23C9A24B'/%3E%3C/svg%3E"><style>:root{--walnut:#6B4530;--brass:#C9A24B;--parch:#F3E9D2;--bg:#FFFEF9;--green:#5A8A5A;--border:#EADDC0}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,sans-serif;color:#2E221C}h1,h2{font-family:serif;color:var(--walnut);margin:0}.card{background:#fff;border:1px solid var(--border);border-radius:22px;padding:14px;margin:10px}.btn{border:none;border-radius:12px;padding:8px 12px;font-weight:600;cursor:pointer;background:var(--parch);color:var(--walnut)}.btn.primary{background:var(--walnut);color:#fff}.btn.brass{background:var(--brass)}.pill{border-radius:999px;padding:6px 12px;border:1px solid var(--border);background:var(--parch);cursor:pointer;margin:2px}.pill.active{background:var(--walnut);color:#fff}.tab{padding:8px 12px;border-radius:12px;border:1px solid var(--border);background:var(--parch);cursor:pointer;font-weight:700;margin-right:6px}.tab.active{background:var(--brass)}.notice{background:#FFF8E6;border:1px solid #E8C547;border-radius:12px;padding:8px;margin:8px 0}.grid{display:grid;gap:12px}.grid-3{grid-template-columns:260px 1fr 300px}@media(max-width:1000px){.grid-3{grid-template-columns:1fr}}.pill small{display:block;font-size:.72rem;font-weight:400}
.pillF{border-radius:18px;text-align:left;line-height:1.2}
#fPane{display:none}
.isF #fPane{display:block}
.isF #visual,.isF #qBox,.isF #ansArea,.isF #fb,.isF #genBtns,.isF #celebrate{display:none!important}
.fparent{margin:4px 0 8px;color:#7A6A5D}
.fprog{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.fprog svg{width:34px;height:34px;display:block}
.fcard{background:var(--parch);border:2px solid var(--border);border-radius:22px;padding:14px}
.fprompt{font-family:serif;font-size:1.5rem;font-weight:800;color:var(--walnut);text-align:center;margin:2px 0 12px}
.fvis{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px}
.fsvg{display:block;max-width:100%;height:auto}
.fnums{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.fbtn{min-width:84px;min-height:72px;font:inherit;font-size:2.2rem;font-weight:800;border-radius:20px;border:3px solid var(--brass);background:#fff;color:var(--walnut);cursor:pointer;position:relative;padding:4px 10px}
.fbtn:hover:not(:disabled){background:var(--parch)}
.fbtn:focus-visible,.fitem:focus-visible,.fchip:focus-visible,.fcell:focus-visible,.fcard-btn:focus-visible,.fgrp:focus-visible,.fbox:focus-visible,.fbowl:focus-visible,.fnext:focus-visible,.fdo:focus-visible{outline:4px solid var(--walnut);outline-offset:3px}
.fbtn.wrong,.fcard-btn.wrong,.fgrp.wrong,.fbox.wrong{opacity:.5;border-style:dashed}
.fbtn:disabled{cursor:default}
.fbtn.right,.fcard-btn.right,.fgrp.right,.fbox.right{border-color:var(--green);box-shadow:0 0 0 5px var(--green)}
.right::after{content:"\2713";position:absolute;top:-12px;right:-8px;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;font-size:1rem;line-height:28px;text-align:center}
.fnums.locked .fbtn{opacity:.45}
.fhint{text-align:center;color:#7A6A5D;margin-top:8px;min-height:1.3em}
.ffb{min-height:2.4em;text-align:center;font-weight:700;font-size:1.15rem;margin-top:10px;color:var(--walnut)}
.ffb .fstar{display:inline-block;width:26px;height:26px;vertical-align:-6px;margin-right:6px}
.fact{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.fnext,.fdo{min-height:56px;min-width:140px;font:inherit;font-size:1.2rem;font-weight:800;border-radius:16px;border:none;background:var(--walnut);color:#fff;cursor:pointer;padding:8px 22px}
.fdo.alt{background:var(--brass);color:#2E221C}
.fcount{position:relative;width:100%;max-width:440px;margin:0 auto}
.fitem{position:absolute;transform:translate(-50%,-50%);width:48px;height:48px;padding:4px;border:0;background:var(--walnut) content-box;border-radius:50%;color:#fff;font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.fitem span{position:relative}
.fitem.sq{border-radius:12px}
.fitem.tapped{background:var(--brass) content-box;color:#2E221C}
.fitem.dim{background:none;box-shadow:inset 0 0 0 3px var(--walnut);cursor:default;pointer-events:none;opacity:.6;border-radius:50%;padding:7px}
.fitem.dim{box-shadow:none;border:3px solid var(--walnut);padding:4px;background-clip:padding-box}
.fchips{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin:10px 0;min-height:52px}
.fchip{width:48px;height:48px;padding:4px;border:0;background:var(--walnut) content-box;border-radius:50%;cursor:grab;touch-action:none}
.fchip.sel{box-shadow:0 0 0 4px var(--brass);background:var(--walnut) content-box}
.fbowl{display:block;width:100%;max-width:420px;margin:0 auto;border:3px dashed var(--brass);border-radius:22px;background:#fff;padding:6px;cursor:pointer;color:var(--walnut)}
.fbowl.fover,.fcell.fover{box-shadow:0 0 0 5px var(--brass)}
.fbowl svg{display:block;width:100%;height:auto}
.fframe{display:grid;grid-template-columns:repeat(5,minmax(48px,56px));gap:4px;justify-content:center;margin:0 auto}
.fcell{width:100%;min-height:48px;aspect-ratio:1/1;border:3px solid var(--brass);background:#fff;border-radius:10px;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fcell i{display:block;width:38px;height:38px;border-radius:50%;background:var(--walnut)}
.fcell.fixed{cursor:default}
.fcell.hl i{box-shadow:0 0 0 4px var(--green)}
.fcard-btn{background:#fff;border:3px solid var(--brass);border-radius:18px;min-height:96px;padding:6px;cursor:pointer;position:relative;color:var(--walnut)}
.fcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.fcards .fcard-btn svg{display:block;width:100%;height:auto;max-height:110px}
.fnumeral{width:104px;height:104px;border-radius:50%;background:#fff;border:4px solid var(--brass);display:flex;align-items:center;justify-content:center;font-size:3.4rem;font-weight:800;color:var(--walnut)}
.fgrps{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.fgrp{background:#fff;border:3px solid var(--brass);border-radius:18px;min-height:88px;padding:6px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
.fgrp svg{display:block}
.fgl{position:absolute;left:12px;top:6px;font-size:.8rem;font-weight:700;color:#7A6A5D}
.feq{align-self:center;min-width:120px}
.fsame{display:block;font-size:.75rem;font-weight:700}
.fsent{font-size:2.6rem;font-weight:800;color:var(--walnut);display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.fsq{display:inline-block;width:56px;height:56px;border:4px dashed var(--brass);border-radius:12px;background:#fff}
.fturn{display:flex;flex-direction:column;gap:10px;align-items:center}
.fturn .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-weight:800;color:var(--walnut)}
.fpair{position:relative;flex:1 1 100%;max-width:520px;margin:0 -12px;height:190px}
.fpair svg{position:absolute;left:0;top:0;width:100%;height:100%}
.fbox{position:absolute;top:0;height:60px;transform:translateX(-50%);background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:flex-start;justify-content:center}
.fbox b{display:block;width:40px;height:40px;margin-top:6px;border:3px solid var(--brass);background:#fff;border-radius:8px}
.fbox.right b{border-color:var(--green)}
.fbox.wrong{border:0}
.fpair .fc{position:absolute;bottom:14px;width:30px;height:30px;border-radius:50%;background:var(--walnut);transform:translateX(-50%)}
.fdone{text-align:center}
.fdone h3{font-family:serif;color:var(--walnut);font-size:1.5rem;margin:6px 0}
.fghost{position:fixed;width:44px;height:44px;border-radius:50%;background:var(--walnut);pointer-events:none;z-index:99;transform:translate(-50%,-50%);opacity:.9}
@media (prefers-reduced-motion:no-preference){
 .fpop{animation:fpop .35s ease-out 1}
 @keyframes fpop{0%{transform:scale(.5)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
}
@media (max-width:520px){.fprompt{font-size:1.3rem}.fbtn{min-width:76px}}

/* small phones: let the question card use more of the width so the ten frame and counters fit at 320 px */
@media(max-width:420px){#fPane{margin-left:-16px;margin-right:-16px}.fcard{padding:10px}}

/* ===== Shapes and space ===== */
.gpic{position:relative;margin:0 auto;max-width:100%}
.gpic>svg{display:block;width:100%;height:auto}
.gpic.gscale{width:min(230px,100%)}
.gpic.gscale>svg{width:100%}
.fcards.gscale{grid-template-columns:1fr}
.fcards.gscale .fcard-btn svg{width:min(230px,100%);max-height:none}
.gtap{position:absolute;padding:0;margin:0;border:0;background:transparent;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;border-radius:50%;transform:translate(-50%,-50%);font:inherit}
.gtap.side{border-radius:23px}
.gtap:hover:not(:disabled){background:rgba(201,162,75,.3)}
.gtap:focus-visible{outline:4px solid var(--walnut);outline-offset:2px;box-shadow:0 0 0 2px #fff}
.gtap:disabled{cursor:default}
.gtap.side.on{background:rgba(201,162,75,.55)}
.gtap b{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--brass);border:3px solid var(--walnut);color:#2E221C;font-weight:800;font-size:1.05rem;line-height:1}
.gtap.item.on b,.gtap.corner.on b{width:36px;height:36px}
.fcards.one{grid-template-columns:1fr}
.fcards.one .fcard-btn svg{max-height:84px}
.gvis{width:100%;display:flex;justify-content:center}
.gtools{margin-top:14px}
.gtools h3{margin:10px 0 4px}
.gtools ul{margin:4px 0 8px 18px;padding:0}
.gtools .fdo{margin:4px 6px 4px 0}
.gpuz{margin:6px 0}
.gpuz b{color:var(--walnut)}
#gPrintHost{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;background:#fff;overflow:auto;padding:12px;page:gsheet}
body.gprinting #gPrintHost{display:block}
.gpbar{max-width:460px;margin:0 auto 10px}
#gPrintHost .gsheet svg{display:block;width:100%;max-width:460px;height:auto;margin:0 auto;border:1px solid var(--border)}
@page gsheet{size:210mm 297mm;margin:0}
@media print{
 button,input,select,textarea,nav{display:none!important}
 body.gprinting>*:not(#gPrintHost){display:none!important}
 body.gprinting #gPrintHost{position:static;overflow:visible;padding:0;display:block}
 body.gprinting .gpbar{display:none}
 body.gprinting #gPrintHost .gsheet svg{width:210mm;height:297mm;max-width:none;border:0;margin:0}
}
</style></head><body>
<header style="padding:14px;max-width:1400px;margin:auto"><h1>Wattlewood Maths</h1><div style="color:#7A6A5D">Foundation to Year 10 • Teach Then Do</div></header>
<main style="max-width:1400px;margin:auto;padding:0 10px 30px">
<div class="card" id="childBar"></div>
<div class="card"><strong>Year:</strong> <span id="yearPills"></span> <span id="yearDesc" style="color:#7A6A5D;margin-left:8px"></span></div>
<div class="card"><strong>Resets:</strong> <button class="btn" onclick="clearAns()">Clear Answer</button> <button class="btn brass" onclick="newQs()">New Questions</button> <button class="btn" onclick="clearAll()">Clear All & Restart for child</button></div>
<div class="grid grid-3">
<div class="card"><h2 id="topicHead">Topics</h2><div id="topicList"></div></div>
<div class="card"><div><button class="tab active" id="tLearn" onclick="switchTab('learn')">📚 Learn</button><button class="tab" id="tPractice" onclick="switchTab('practice')">✏️ Practice</button></div>
<div id="learnPane" style="margin-top:10px"></div>
<div id="practicePane" style="display:none;margin-top:10px">
<div id="childPrompt1" class="notice" role="status" style="display:none"></div>
<div><span id="qCountBox">Qs: <select id="qCount" onchange="newQs()"><option>5</option><option selected>10</option><option>15</option></select></span> <label style="margin-left:10px">Depth: <select id="qDepth" onchange="newQs()"><option value="starter">Starter</option><option value="practice" selected>Practice</option><option value="challenge">Challenge</option><option value="mixed">Mixed</option></select></label> <span id="prog"></span> <span id="score"></span></div>
<div id="fPane"></div>
<div id="visual" style="background:#F3E9D2;border-radius:12px;padding:10px;margin:8px 0;min-height:50px"></div>
<div id="qBox" style="font-size:1.2rem;font-weight:700;margin:8px 0"></div>
<div id="ansArea"></div><div id="fb" style="margin-top:8px"></div>
<div id="genBtns" style="margin-top:10px"><button class="btn primary" onclick="checkAns()">Check</button> <button class="btn" onclick="nextQ()">Next →</button> <button class="btn brass" onclick="newQs()">New Questions — never same</button></div>

</div></div>

<label>Reflection: <input id="refl" style="width:100%" placeholder="I used groups of 4"></label><br>
<label>Duration: <input id="dur" type="number" value="15" style="width:70px"> mins</label>
<table><thead><tr><th>Date</th><th>Title</th><th>Note</th><th></th></tr></thead><tbody id="logBody"></tbody></table>
<div class="notice">This file contains your child's name and photos. Store it somewhere private.</div>
<button class="btn primary" onclick="exportEv()" style="margin-top:8px">⬇️ Export evidence for this child</button><div id="expStatus" style="color:#7A6A5D"></div>
</div></div>
</main>

<div id="gPrintHost"></div>
<script>
// FIXED init - allows clearing embedded Mia/Jude, respects first-load vs cleared
let rawChildren=localStorage.getItem('w-maths-children');
let children;
if(rawChildren===null){
  children=[];
} else {
  try{children=JSON.parse(rawChildren);}catch{children=[];}
  children=children.map(c=>({id:'s_'+c.name.toLowerCase().replace(/\s+/g,'_'),name:c.name}));
  if(children.length>0) localStorage.setItem('w-maths-children',JSON.stringify(children));
}
let curChild=localStorage.getItem('w-maths-cur');
if(children.length===0){curChild=null;} else {if(!curChild || !children.find(c=>c.id===curChild)) curChild=children[0].id;}

let curYear=10;
const yearInfo={
  1:{desc:'Counting, add/sub within 20',topics:['Counting 0-100','Addition within 20','Subtraction within 20','Place value tens & ones']},
  2:{desc:'Add/sub 100, × as repeated addition',topics:['Addition within 100','Subtraction within 100','Multiplication as repeated addition 2,5,10','Division as sharing','Fractions halves quarters']},
  3:{desc:'Tables 2-5-10 division',topics:['Multiplication 2,3,4,5,10','Division facts','Fractions of collections','Place value to 10000','Perimeter']},
  4:{desc:'6-10 tables remainders',topics:['Multiplication 6-10 and 2-digit x 1-digit','Division with remainders','Fractions equivalent','Decimals tenths hundredths']},
  5:{desc:'Fractions decimals %',topics:['Fractions add/sub & × whole','Decimals add/sub/mul','Percentages of 100','Order of operations intro']},
  6:{desc:'Fractions decimals % with box',topics:['Fractions all operations','Decimals all operations','Percentages','Find unknown with box','BODMAS']},
  7:{desc:'Integers, FDP, equations, ratio',topics:['Integers add/sub','FDP conversions','One-step equations with x','Two-step equations','Ratio','Area & volume']},
  8:{desc:'Linear, stats, expand (Pythagoras moved to Y9)',topics:['Linear equations','Mean median mode','Expand & factorise']},
  9:{desc:'Quadratics, trig, Pythagoras (Y9 per ACARA)',topics:['Quadratics intro','Trigonometry sin cos tan','Pythagoras theorem']},
  10:{desc:'Quadratics solving, trig rules, finance',topics:['Quadratics solving','Trig sine cosine rule','Financial maths interest']}
};
let curTopic=yearInfo[curYear].topics[0];

const teach={
'Counting 0-100':{what:'Counting tells you how many things there are. 0 means there is nothing there. We count in order to know if we have enough.',how:'Touch each object once as you say the number. When you get to 10, make a bundle or draw a circle around those 10. That bundle is 1 ten. The leftovers are ones.',steps:['Say numbers 0-100 in order','Point to each object exactly once','When you reach 10, bundle it as 1 ten','Count bundles (tens) then leftovers (ones)'],ex:'Put out 23 blocks. Make 2 bundles of 10 (20) and 3 left over. So 23 = 2 tens + 3 ones = 20 + 3. If you miss a block or count one twice, your total will be wrong.'},
'Addition within 20':{what:'Addition means putting two groups together to make one bigger group. We use it when we get more things. Within 20 means the answer will be 20 or less, and often we have to cross over 10.',how:'Use a tens frame (10 holes). Put the bigger number in first. See how many empty holes left to make 10. Split the smaller number to fill those holes, then add what is left.',steps:['Start with the bigger number','How many more to make 10?','Split the smaller number into those two parts','Fill to 10, then add the rest','Write the total'],ex:'8+5: Tens frame has 8. Needs 2 to make 10. Split 5 into 2+3. 8+2=10, plus 3 left =13. Common mistake: starting from 1 instead of starting from 8 and counting on.'},
'Subtraction within 20':{what:'Subtraction means taking away or finding how many more you need. We use it to find what is left or the difference between two amounts.',how:'Draw dots for the big number. Cross out how many you take away. Or count up from the small number to the big number on a number line.',steps:['Draw or imagine the whole amount','Cross out or take away the part','Count what is left','Or count up from smaller to bigger to find difference'],ex:'14-6: Draw 14 dots, cross out 6. 8 left, so 14-6=8. Check: 8+6=14. Another way: 6 to 10 is 4, 10 to 14 is 4, total 8.'},
'Place value tens & ones':{what:'Place value means where a digit sits tells you its value. In 47, the 4 is not 4, it is 4 tens (40). 10 ones = 1 ten.',how:'Use bundles of sticks or blocks. Make groups of 10. The number of bundles is tens digit, leftovers is ones digit.',steps:['Make bundles of 10','Count how many bundles = tens','Count leftovers = ones','Write tens as 10s, ones as 1s'],ex:'47: Make 4 bundles of 10 (40) and 7 single sticks. So 47 = 4 tens + 7 ones = 40+7. Mistake: thinking 47 is 4+7=11, forgetting place value.'},
'Addition within 100':{what:'Adding bigger numbers up to 100. We add ones to ones and tens to tens. If ones make 10 or more, we make a new ten (regroup).',how:'Stack numbers with ones under ones, tens under tens. Add ones first. If 10 or more, carry 1 ten to tens column.',steps:['Line up ones and tens','Add ones column','If 10 or more, bundle as new ten and carry','Add tens column including carried ten','Write answer'],ex:'47+25: Ones 7+5=12 = 1 ten +2 ones. Write 2 ones, carry 1 ten. Tens 4+2+1 carried=7 tens. Answer 72. Check by estimation: 50+20≈70, so 72 makes sense.'},
'Subtraction within 100':{what:'Taking away from numbers up to 100. Sometimes you do not have enough ones, so you borrow 1 ten and turn it into 10 ones.',how:'Write tens and ones columns. Check ones first. If top ones smaller than bottom ones, borrow 1 ten from tens column.',steps:['Line up ones and tens','Do we have enough ones?','If not, borrow 1 ten =10 ones','Subtract ones, then subtract tens','Check by adding answer to what you took away'],ex:'62-28: Ones 2-8 not enough. Borrow 1 ten from 6 tens, now 5 tens left and 12 ones. 12-8=4 ones. 5-2=3 tens. Answer 34. Check 34+28=62.'},
'Multiplication as repeated addition 2,5,10':{what:'Multiplication is fast adding. 3 groups of 4 means 4+4+4=12. It is quicker than adding one by one.',how:'Draw an array: rows = how many groups, columns = how many in each group. Count all dots or skip count by the group size.',steps:['How many groups? That is number of rows','How many in each group? That is dots per row','Draw array','Count all dots or skip count'],ex:'3 groups of 4: Draw 3 rows, 4 dots each row. Count: 4,8,12. So 3×4=12. Mistake: mixing up groups vs in each group.'},
'Division as sharing':{what:'Division is sharing fairly. 12 shared among 3 means each gets same amount. Or how many groups you can make.',how:'Deal out one by one like cards. Give each person 1, then another 1, until none left. Count how many each got.',steps:['How many to share?','How many people or groups?','Deal one at a time fairly','Count how many each gets','Check by multiplying back'],ex:'12 shared among 3: Deal 1 to each (3 dealt), deal again (6 dealt), deal again (9 dealt), deal again (12 dealt). Each has 4. Check 3×4=12.'},
'Fractions halves quarters':{what:'A fraction is a whole cut into equal parts. Half = cut into 2 equal parts. Quarter = cut into 4 equal parts. Equal means same size.',how:'Fold paper or cut a chocolate bar. Denominator (bottom number) tells how many equal parts. Numerator (top) tells how many you have.',steps:['What is the whole?','How many equal parts? (denominator)','How many parts do we have? (numerator)','Each part must be same size'],ex:'Half of 8 apples: Whole 8, cut into 2 equal groups. 8÷2=4. So half of 8=4. Quarter of 8 = 8÷4=2. Mistake: thinking half of 8 is 2 because half of 4 is 2 — always start from the whole.'},
'Multiplication 2,3,4,5,10':{what:'Times tables are shortcuts for repeated addition. Knowing them makes maths faster.',how:'Use array or skip counting. For 4×6, make 4 rows of 6 and count, or count 6,12,18,24.',steps:['Draw array or use skip counting','Count rows × columns','Write product','Check with repeated addition if unsure'],ex:'4×6: Array 4 rows, 6 dots each =24 dots. Skip count: 6,12,18,24. So 4×6=24. 24÷4=6 checks it.'},
'Division facts':{what:'Division undoes multiplication. If you know 4×6=24, you know 24÷4=6 and 24÷6=4.',how:'Ask: what times the divisor makes the dividend? Use your times tables backwards.',steps:['Look at divisor','Think of its times table','Find what × divisor = dividend','That is the answer'],ex:'24÷4: Think 4×?=24. You know 4×6=24, so ?=6. Answer 6. Common mistake: mixing up 24÷4 with 24÷6.'},
'Fractions of collections':{what:'A fraction of a collection means a part of a group. 3/4 of 12 means split 12 into 4 equal groups and take 3 groups.',how:'First divide by denominator to find one part, then multiply by numerator to get how many parts you need.',steps:['Divide total by denominator to find 1 part','Multiply that by numerator','That is the answer'],ex:'3/4 of 12: 12÷4=3 (one quarter). 3 quarters =3×3=9. So 3/4 of 12=9. Draw 12 dots, circle 4 groups of 3.'},
'Place value to 10000':{what:'Numbers up to 10,000 have four places: thousands (1000s), hundreds (100s), tens (10s), ones (1s). 10 hundreds =1 thousand.',how:'Use a place value chart with 4 columns. Put each digit in its column. Read from left: thousands, then hundreds, etc.',steps:['Make chart: Th H T O','Put each digit in correct column','Read value: digit × its place','Add parts to check'],ex:'2,345: 2 in thousands=2000, 3 in hundreds=300, 4 in tens=40, 5 in ones=5. 2000+300+40+5=2345. Ones digit in 2,692 is 2 (the last digit).'},
'Perimeter':{what:'Perimeter is the distance all the way around the outside of a shape. Like fencing around a garden.',how:'Walk around the shape and add up each side length. For rectangle, opposite sides equal, so 2×(length+width) is shortcut.',steps:['List all side lengths','Add them all together','For rectangle use 2×(length+width)','Include units (cm, m)'],ex:'Rectangle 5cm by 3cm: Two sides 5, two sides 3. 5+3+5+3=16cm. Or 2×(5+3)=2×8=16cm. Mistake: adding only two sides.'},
'Multiplication 6-10 and 2-digit x 1-digit':{what:'Bigger times tables and multiplying a 2-digit number by 1-digit. We split the 2-digit into tens and ones, multiply each, then add.',how:'Split 23 into 20+3. Multiply both by the other number, then add results. This is called distributive law.',steps:['Split 2-digit into tens + ones','Multiply tens part','Multiply ones part','Add the two results'],ex:'23×4: 20×4=80, 3×4=12, 80+12=92. So 23×4=92. Check: 23+23+23+23=92.'},
'Division with remainders':{what:'Sometimes you cannot share exactly, there is leftover. Leftover is remainder. 13 shared among 4: each gets 3, 1 left.',how:'Find biggest times table multiple that is less than or equal to the number. Subtract to find remainder.',steps:['Find multiple of divisor just below dividend','That multiple ÷ divisor = quotient','Subtract multiple from dividend = remainder','Write as quotient r remainder'],ex:'13÷4: 4×3=12 is biggest below 13. 12÷4=3. Remainder 13-12=1. So 13÷4=3 r1. Means 3 each, 1 left over.'},
'Fractions equivalent':{what:'Equivalent fractions look different but are same size. 1/2 =2/4 =4/8. You get them by multiplying or dividing top and bottom by same number.',how:'Multiply numerator and denominator by same number to make bigger equivalent. Or divide both by same number to make simpler.',steps:['Pick a number to multiply top and bottom','Multiply both','You have equivalent fraction','Same value, different name'],ex:'1/2 = ?/8: 2 to 8 is ×4, so 1×4=4. So 1/2=4/8. Draw two pizzas same size, one cut in 2, one in 8, shaded same amount.'},
'Decimals tenths hundredths':{what:'Decimal point separates whole number from parts less than 1. First place after point is tenths (out of 10), second is hundredths (out of 100).',how:'Think of money: $1.40 =1 dollar +40 cents. Tenths are 10 per whole, hundredths 100 per whole. 10 tenths=1.',steps:['Find decimal point','First digit after = tenths (×0.1)','Second digit after = hundredths (×0.01)','10 tenths=1 whole, 100 hundredths=1 whole'],ex:'0.4 =4 tenths =4/10. 0.05=5 hundredths=5/100. 1.25=1 +2 tenths+5 hundredths. Mistake: thinking 0.5 is 5 hundredths — it is 5 tenths.'},
'Fractions add/sub & × whole':{what:'Adding fractions with same bottom: keep bottom, add tops. Multiplying fraction by whole number: multiply top by whole, then divide by bottom.',how:'For +/− same denominator, add/subtract numerators only. For × whole, whole×numerator ÷ denominator.',steps:['Check operation','If +/− and same denominator, add/sub tops keep bottom','If × whole, multiply top by whole then ÷ bottom','Simplify if possible'],ex:'2/8+3/8=5/8 (bottom stays 8). 2/3×6: 2×6=12, 12÷3=4. So 2/3 of 6=4. Picture: 6 split into 3 groups=2 each, 2 groups=4.'},
'Decimals add/sub/mul':{what:'Decimals are numbers with tenths/hundredths. We add and subtract by lining up decimal points. Multiply by ignoring point then putting it back.',how:'For +/−, line up decimal points like columns. For ×, ignore point, multiply as whole numbers, then count decimal places to put point back.',steps:['For +/− line up decimal points','Add/subtract as normal','For × ignore point, multiply','Count total decimal places, put point back that many from right'],ex:'1.2+0.45: Line up point: 1.20+0.45=1.65. 0.3×4: Ignore point 3×4=12, one decimal place so 1.2. Mistake: not lining up points for addition.'},
'Percentages of 100':{what:'Percent means per 100. 50% means 50 per 100 = half. 25% = quarter. We use % for discounts, stats, etc.',how:'To find % of 100, just take that many. For % of other numbers, divide by 100 to find 1%, then multiply by % needed. Or use fraction.',steps:['Remember % = /100','Divide whole by 100 to get 1%','Multiply 1% by % you need','Or use known facts: 50%=half, 25%=quarter, 10%=tenth'],ex:'25% of 80: 1% of 80=0.8. 25×0.8=20. Or quarter of 80=20. 25% of 100=25 (25 per 100).'},
'Order of operations intro':{what:'When a question has + and × and brackets, we need rules for which to do first, or everyone gets different answer. BODMAS tells us order.',how:'Brackets first, then Orders (powers), then Division and Multiplication left to right, then Addition and Subtraction left to right. Small brackets mean do inside first.',steps:['Do anything inside brackets () first','Do × and ÷ from left to right','Do + and − from left to right','Check by doing brackets first'],ex:'(2+1)×4: Brackets 2+1=3, then 3×4=12. If you did 1×4=4 then 2+4=6 you would be wrong. Brackets change answer.'},
'Fractions all operations':{what:'Fractions can be added, subtracted, multiplied and divided. Each operation has its own rule.',how:'+− need same denominator: find common bottom then add tops. ×: top×top, bottom×bottom. ÷: flip second fraction and multiply.',steps:['Look at operation sign','If +/− find common denominator, then add/sub tops','If × multiply tops and bottoms','If ÷ flip second fraction then ×','Simplify answer'],ex:'2/3×1/2: Tops 2×1=2, bottoms 3×2=6 =>2/6=1/3. 3/4÷1/2: Flip second 1/2 to 2/1, then 3/4×2/1=6/4=3/2=1 and 1/2. Mistake: adding bottoms when adding fractions.'},
'Decimals all operations':{what:'Decimals in all four operations. Same rules as whole numbers but keep track of decimal point.',how:'+− line up point. × count decimal places. ÷ move point to make divisor whole number.',steps:['For +− line up points','For × ignore point, multiply, count places','For ÷ move point in both numbers until divisor whole','Check place value makes sense'],ex:'1.5×2=3.0 (1 decimal place). 4.8÷0.6: Move point in both ×10 =>48÷6=8. So 4.8÷0.6=8. Estimation helps: 5÷0.5=10, so 8 is close.'},
'Percentages':{what:'Percent means out of 100. 15% means 15 per 100. Used to find part of a whole or discount.',how:'Find 1% by ÷100, then × by % you need. Or use decimal: 15% =0.15.',steps:['Write % as /100 or decimal','Divide whole by 100 to get 1%','Multiply by % needed','Check if answer sensible (50% is half)'],ex:'15% of 200: 1% of 200=2, 15×2=30. So 15% of 200=30. Check: 10% is 20, 5% is 10, so 15% is 30.'},
'Find unknown with box':{what:'Sometimes a number is missing and we show it with a Box (in Year 5-6 we use Box instead of letter x). Box means find the mystery number that makes equation true.',how:'Think of balance scales. What operation is done to Box? Do opposite (inverse) operation to both sides to find Box.',steps:['What operation with Box? + − × ÷','Do opposite to undo it','Apply to both sides','Check by putting answer back in'],ex:'Box+5=12: To get Box alone, subtract 5 both sides. Box=12-5=7. Check 7+5=12. 3×Box=15: Divide both sides by 3, Box=5.'},
'BODMAS':{what:'BODMAS is order rules so everyone gets same answer: Brackets, Orders (powers), Division/Multiplication, Addition/Subtraction. Brackets always first.',how:'Scan for brackets (). Do inside them first. Then do × and ÷ left to right. Then + and − left to right.',steps:['Find brackets, do inside first','Do × and ÷ from left to right','Do + and − from left to right','If only + and −, just left to right'],ex:'6+4×(2+1): Brackets (2+1)=3. Then 4×3=12. Then 6+12=18. If you did 6+4=10×3=30 you ignored BODMAS. (6+4)×2=10×2=20 shows brackets change answer.'},
'Integers add/sub':{what:'Integers include negatives (-1,-2) and positives. Negative means below zero, like debt or cold temperature. Adding negative is like subtracting.',how:'Use number line. Positive moves right (up), negative moves left (down). Adding moves right, subtracting moves left, but sign flips.',steps:['Draw number line with 0 in middle','Start at first number','Adding positive moves right, negative moves left','Subtracting positive moves left, negative moves right','Where you land is answer'],ex:'-3+5: Start at -3, move 5 right. -3 to 0 is 3, then 2 more to 2. So -3+5=2. -3-2: Start -3 move 2 left = -5. Mistake: thinking -3+5=-8.'},
'FDP conversions':{what:'FDP = Fractions, Decimals, Percentages. Same amount can be written three ways. 1/2=0.5=50%.',how:'Fraction to decimal: divide top by bottom. Decimal to %: ×100. % to decimal: ÷100. Fraction to %: first to decimal then ×100.',steps:['Fraction to decimal: numerator ÷ denominator','Decimal to %: ×100','% to decimal: ÷100','% to fraction: %/100 then simplify'],ex:'3/4: 3÷4=0.75 decimal. 0.75×100=75%. So 3/4=0.75=75%. 20% =20/100=1/5=0.2.'},
'One-step equations with x':{what:'Equation with letter x means mystery number. One-step means x has one operation done to it. Find x that makes both sides balance.',how:'Think of scales balanced. Whatever was done to x, do opposite to both sides to get x alone.',steps:['What was done to x? × ÷ + −','Do opposite (inverse) to both sides','Simplify','Check by putting x back in'],ex:'3x=18: x is ×3. Do opposite ÷3 both sides. x=18÷3=6. Check 3×6=18 ✓. x+5=12: Subtract 5 both sides, x=7.'},
'Two-step equations':{what:'Two-step equation has two operations on x, like 2x+3=11. Need to undo in reverse order to find x.',how:'Undo + and − first, then undo × and ÷. Like unwrapping a present in reverse order.',steps:['Look at what was done to x last (usually + or −) undo that first','Now x has only × or ÷ left, undo that','Check answer'],ex:'2x+3=11: Last operation +3. Subtract 3 both sides =>2x=8. Now x×2, divide by 2 =>x=4. Check 2×4+3=11 ✓.'},
'Ratio':{what:'Ratio compares how many of one thing to another. 2:3 means for every 2 of first, there are 3 of second. We share total by adding ratio parts.',how:'Add ratio numbers to get total parts. Divide total amount by total parts to get one part value. Multiply by each ratio number.',steps:['Add ratio parts to get total parts','Divide total amount by total parts = value of 1 part','Multiply 1 part by each ratio number','Check parts add back to total'],ex:'Share $20 in ratio 2:3. Total parts 2+3=5. One part $20÷5=$4. First share 2×$4=$8, second 3×$4=$12. Check $8+$12=$20. Mistake: not adding parts first.'},
'Area & volume':{what:'Area is flat space inside a 2D shape (like carpet). Volume is space inside a 3D object (like water in box). Different formulas.',how:'Area rectangle = length × width. Area triangle = half × base × height. Volume box = length × width × height.',steps:['What shape?','Pick correct formula','Multiply lengths','Include units: cm² for area, cm³ for volume'],ex:'Rect 4cm×5cm: Area=4×5=20cm². Box 4×5×3: Volume=4×5×3=60cm³. Mistake: using area formula for volume or forgetting squared/cubed units.'},
'Linear equations':{what:'Linear equation has x to power 1, graph is straight line. Can have x on both sides. Solve for x that balances.',how:'Collect x terms on one side, numbers on other side, then divide to get x alone.',steps:['Expand brackets if any','Move x terms to one side, numbers to other (add/sub both sides)','Combine like terms','Divide to get x','Check'],ex:'3x-2=2x+4: Subtract 2x both sides =>x-2=4. Add 2 both sides =>x=6. Check 3×6-2=16, 2×6+4=16 ✓.'},
'Mean median mode':{what:'Three ways to describe average. Mean = add all and divide by how many (can be .5). Median = middle when sorted smallest to biggest. Mode = most common.',how:'Mean: sum ÷ count, keep .5 if needed. Median: sort list, pick middle. Mode: count which appears most.',steps:['For mean: add all numbers, divide by count, keep exact (e.g., 4.5)','For median: sort low to high, middle one is median','For mode: count frequency, most frequent is mode','Check if more than one mode or no mode'],ex:'2,3,3,6,6: Mean 20÷5=4. Sorted 2,3,3,6,6 median middle=3. Mode both 3 and 6 appear twice (two modes). If numbers 2,3,4, mean 3, median 3, but data spread different.'},
'Expand & factorise':{what:'Expand means multiply brackets out to get longer expression. Factorise is reverse: put common factor outside or find two numbers that make expression.',how:'Expand: each term in first bracket × each term in second (FOIL: First Outside Inside Last). Factorise: find common factor or find two numbers that multiply to last number and add to middle.',steps:['Expand: multiply each term in first bracket by each in second','Collect like terms (x terms together)','Factorise: look for common factor first','Then look for two numbers that multiply to c and add to b'],ex:'(x+2)(x+3): x×x=x², x×3=3x, 2×x=2x, 2×3=6 =>x²+5x+6. Factorise x²+5x+6: need 2 numbers ×6 and +5 =>2 and 3, so (x+2)(x+3).'},
'Quadratics intro':{what:'Quadratic has x² term. Graph is U-shaped parabola. Standard form ax²+bx+c. a tells how wide, c is where it crosses y-axis.',how:'Expand brackets to get ax²+bx+c form, then identify a,b,c. a is number in front of x², b in front of x, c is constant.',steps:['Expand brackets if given','Collect x² terms = a','Collect x terms = b','Collect numbers = c'],ex:'(x+1)(x+2)=x²+3x+2. So a=1,b=3,c=2. If (x+1)²=x²+2x+1, a=1,b=2,c=1. Parabola opens up because a positive.'},
'Trigonometry sin cos tan':{what:'Trigonometry in right triangle: relates angles to sides. SOH CAH TOA: Sin=Opposite/Hypotenuse, Cos=Adjacent/Hypotenuse, Tan=Opposite/Adjacent.',how:'Label triangle: Hypotenuse is longest opposite right angle, Opposite is across from angle you use, Adjacent next to angle. Pick ratio that uses sides you know.',steps:['Label sides: Hyp longest, Opp opposite angle, Adj next to angle','Choose sin cos tan based on what you know and want','Write ratio','Use calculator to find value or angle'],ex:'Right triangle opp=3 hyp=5: sin=3/5=0.6. So angle with sin 0.6 is about 37°. If adj=4 hyp=5 cos=4/5=0.8. Tan=opp/adj=3/4=0.75. Mistake: mixing up opp and adj.'},
'Pythagoras theorem':{what:'Pythagoras only for right triangles (one 90° corner). a²+b²=c² where c is hypotenuse (longest side opposite right angle). Find missing side.',how:'Square the two shorter sides, add, square root for hypotenuse. If finding short side, hyp² - other side² then square root.',steps:['Find right angle, hypotenuse is longest opposite it','If finding hypotenuse: square both short sides, add, square root','If finding short side: hyp² - known short² then square root','Check answer smaller than hyp if finding leg'],ex:'Legs 5 and 12: 5²=25,12²=144, sum=169, √169=13 hyp. If hyp 13 leg 5: 13²-5²=169-25=144 √144=12 other leg. Triple 3-4-5, 5-12-13 always works.'},
'Quadratics solving':{what:'Solving a quadratic means finding the x values that make the equation true (graph crosses x-axis). Can have 0,1,2 answers. Form is ax²+bx+c=0. Year 10 mostly uses monic quadratics where a=1 (just x²). If a is not 1, like 2x²+5x+3=0, the simple p×q=c shortcut breaks and you need an extra step (AC method) or the formula.',how:'First make sure one side =0. For monic (x² with no number in front), find two numbers that multiply to c and add to b. Put them in brackets. Why does (x+2)(x+3)=0 give x=-2? Null Factor Law: if A×B=0 then A=0 or B=0. So one bracket must be zero. If a≠1, find numbers that multiply to a×c and add to b (AC method), or use quadratic formula x=(-b±√(b²-4ac))/2a which always works.',steps:['1. Ensure =0: Move everything so ax²+bx+c=0','2. Check a (number in front of x²): If a=1 use monic shortcut. If a≠1 (e.g., 2x²) use AC method: find two numbers that multiply to a×c and add to b, or use formula','3. Monic case: Find p,q where p×q=c and p+q=b','4. Write brackets: (x+p)(x+q)=0','5. Null Factor Law: If (x+p)(x+q)=0 then x+p=0 OR x+q=0, so x=-p or x=-q (not magic, because 0 times anything =0, so one factor must be 0)','6. Check by substitution with × sign: e.g., (-2)²+5×(-2)+6 = 4-10+6 =0'],ex:'Monic: x²+5x+6=0. a=1,b=5,c=6. Need p×q=6 and p+q=5 =>2 and 3. So (x+2)(x+3)=0 => x+2=0 => x=-2 OR x+3=0 => x=-3. Check: (-2)²+5×(-2)+6 =4-10+6=0 ✓. (-3)²+5×(-3)+6=9-15+6=0 ✓.\nNon-monic breaks simple method: 2x²+5x+3=0. If you try p×q=3 and p+q=5 you get 2 and 3? 2×3=6 not 3, so fails. AC method: a×c=2×3=6. Need numbers ×6 and +5 =>2 and 3. Split middle: 2x²+2x+3x+3=0 =>2x(x+1)+3(x+1)=0 =>(x+1)(2x+3)=0 =>x=-1 or x=-3/2. Or formula: x=(-5±√(25-24))/4 =(-5±1)/4.'},
'Trig sine cosine rule':{what:'For non-right triangles, right triangle rules fail. Sine rule: a/sinA=b/sinB=c/sinC (use when you know angle and opposite side pair). Cosine rule: c²=a²+b²-2ab cosC (use when you know 2 sides and included angle SAS, or 3 sides SSS).',how:'Label triangle: sides a,b,c opposite angles A,B,C. If you have 2 sides and included angle, use cosine rule. If you have angle and opposite side, use sine rule.',steps:['Label sides and opposite angles','If SAS (2 sides and angle between): c²=a²+b²-2ab cosC','Calculate c² then square root, round if asked','If you know angle and opposite side pair, use sine rule to find other side: b = a×sinB/sinA'],ex:'a=7,b=8,C=60° cos60=0.5: c²=49+64-2×7×8×0.5=113-56=57 c=√57≈7.55≈8 rounded. If a=7,A=30°,B=50°: b=7×sin50/sin30=7×0.766/0.5≈10.7.'},
'Financial maths interest':{what:'Interest is extra money you pay for borrowing or earn for saving. Simple interest same each year. Compound interest earns interest on interest, grows faster.',how:'Simple: I=P×R×T (P principal, R decimal rate, T years). Total=A=P+I. Compound: A=P(1+R)^T, Interest=A-P.',steps:['Convert % to decimal: 5%=>0.05','Simple interest: P×R×T','Total simple: P+I','Compound total: P×(1+R)^T (power)','Compound interest = total - P'],ex:'$1000 at 5% for 2 years simple: I=1000×0.05×2=$100 total $1100. Compound: A=1000×1.05²=1000×1.1025=$1102.50 interest $102.50. So compound gives $2.50 more because second year you earn interest on first year interest.'}
};

function removeChild(id){if(!confirm('Remove this child name and its entries?')) return; let child=children.find(c=>c.id===id); if(child){ let key='w-maths-entries-'+child.name.toLowerCase().replace(/\s+/g,'_'); localStorage.removeItem(key);} children=children.filter(c=>c.id!==id); localStorage.setItem('w-maths-children',JSON.stringify(children)); if(curChild===id){ curChild=children[0]?children[0].id:null; if(curChild) localStorage.setItem('w-maths-cur',curChild); else localStorage.removeItem('w-maths-cur'); } renderChildBar();renderLog();}
function clearAllChildren(){if(!confirm('Remove ALL child names and ALL their entries? Export first!')) return; children.forEach(c=>{ let key='w-maths-entries-'+c.name.toLowerCase().replace(/\s+/g,'_'); localStorage.removeItem(key);}); children=[]; localStorage.setItem('w-maths-children',JSON.stringify(children)); localStorage.removeItem('w-maths-cur'); location.reload();}

function setHTML(el, html){
  if(!el) return;
  const range=document.createRange();
  range.selectNodeContents(el);
  range.deleteContents();
  if(html) el.appendChild(range.createContextualFragment(String(html)));
}
function addHTML(el, html){
  if(!el||html==null||html==='') return;
  const range=document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  el.appendChild(range.createContextualFragment(String(html)));
}
function renderChildBar(){
  const bar=document.getElementById('childBar');
  bar.replaceChildren();
  const strong=document.createElement('strong');strong.textContent='Child: ';bar.appendChild(strong);
  const all=document.createElement('button');all.className='pill'+(curChild==='ALL'?' active':'');all.type='button';all.textContent='All';all.onclick=()=>switchChild('ALL');bar.appendChild(all);
  children.forEach(c=>{
    const span=document.createElement('span');span.style.display='inline-block';span.style.margin='2px';
    const b=document.createElement('button');b.type='button';b.className='pill'+(c.id===curChild?' active':'');b.textContent=c.name;b.onclick=()=>switchChild(c.id);
    const x=document.createElement('button');x.type='button';x.className='pill';x.style.padding='2px 6px';x.style.background='#FFD9D9';x.style.borderColor='#E8A0A0';x.title='Remove '+c.name;x.textContent='\u00d7';x.onclick=()=>removeChild(c.id);
    span.appendChild(b);span.appendChild(x);bar.appendChild(span);
  });
  bar.appendChild(document.createTextNode(' '));

const FR=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const Fpick=a=>a[FR(0,a.length-1)];
const Fshuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=FR(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const Fsort=a=>a.slice().sort((x,y)=>x-y);
const Frange=(a,b)=>{const o=[];for(let i=a;i<=b;i++)o.push(i);return o;};

function Fscatter(n,w,h,sp){
  for(let attempt=0;attempt<300;attempt++){
    const pts=[];let tries=0;
    while(pts.length<n&&tries<3000){tries++;const p=[FR(0,w),FR(0,h)];if(pts.every(q=>Math.hypot(p[0]-q[0],p[1]-q[1])>=sp))pts.push(p);}
    if(pts.length===n)return pts;
  }
  throw new Error('layout failed');
}
/* three sorted, unique numerals inside [lo,hi] that include ans; adj=true forces a neighbour (ans+1 or ans-1) */
function Fopts(ans,lo,hi,must,adj){
  const s=new Set([ans]);
  (must||[]).forEach(x=>{if(x>=lo&&x<=hi&&s.size<3)s.add(x);});
  if(adj!==false&&!s.has(ans-1)&&!s.has(ans+1)&&s.size<3){
    const c=Fshuf([ans-1,ans+1]).filter(x=>x>=lo&&x<=hi);if(c.length)s.add(c[0]);
  }
  let g=0;while(s.size<3&&g++<80){const c=Fpick([ans-2,ans-1,ans+1,ans+2,ans-3,ans+3]);if(c>=lo&&c<=hi)s.add(c);}
  return Fsort([...s]);
}
/* Number bonds: wrong options are only 1 more, 1 fewer, or the number shown (spec rule) */
function FoptsBond(ans,shown){
  const c=[ans-1,ans+1,shown].filter((x,i,a)=>x>=1&&x<=9&&x!==ans&&a.indexOf(x)===i);
  return Fsort([ans,...Fshuf(c).slice(0,2)]);
}
const FtenStd=n=>Frange(1,n);
function FtenAny(n){
  for(let i=0;i<200;i++){
    const c=Fsort(Fshuf(Frange(1,10)).slice(0,n));
    const std=c.every((x,k)=>x===k+1);
    const topFull=c.filter(x=>x<=5).length===5;      /* avoid the 5-and-more look: this depth is for any boxes */
    if(!std&&!topFull)return c;
  }
  return [1,2,3,7,8,9].slice(0,n);
}

function Fplan(ctx,name,base){
  const k=ctx.dep+name;

  return ctx.memo[k][ctx.i];
}

const F_FIXED_TOP={'sub':'subitising','tf':'tenframe','cm':'counting','cg':'comparing','nb':'bonds'};
const FworkedCursor={};
function Fwrap(q,topicCode,depth){
  const c=JSON.parse(JSON.stringify(q));
  return Object.assign(c,{topic:topicCode,depth,key:q.id,worked:true,F:true,q:c.prompt,a:String(c.answer),st:{tries:0,done:false,correct:false,wrong:[]}});
}
const FtopicCode={subitising:'sub',tenframe:'tf',counting:'cm',comparing:'cg',bonds:'nb'};
function Fworked(topic,dep){return F_FIXED[FTOPICS[topic]][dep].map(q=>Fwrap(q,FtopicCode[FTOPICS[topic]],dep));}
/* put some worked questions into a set: about a third, in random places, taking the next ones in turn so all 60 turn up */
function Finject(topic,out,cur){
  const tk=FTOPICS[topic],cnt=out.length,w=Math.min(Math.max(1,Math.round(cnt/3)),cnt);
  const slots=Fshuf(Frange(0,cnt-1)).slice(0,w),usedIds={};
  slots.forEach(i=>{
    const dep=out[i].depth,pool=F_FIXED[tk][dep],k=tk+'|'+dep;
    let n=cur[k]||0,tries=0;
    while(usedIds[pool[n%pool.length].id]&&tries++<pool.length)n++;
    const it=pool[n%pool.length];
    if(usedIds[it.id])return;                            /* every worked question of this depth is already in the set */
    cur[k]=n+1;usedIds[it.id]=1;
    out[i]=Fwrap(it,FtopicCode[tk],dep);
  });
  return out;
}
/* one set of questions for a topic; mode is starter, practice, challenge or mixed */
function genSetOnce(topic,mode,cnt){
  const g=FGEN[FTOPICS[topic]],ctx={cnt,i:0,memo:{}},out=[],used={};
  const depths=mode==='mixed'?Fshuf(Frange(0,cnt-1).map(i=>['starter','practice','challenge'][i%3])):null;
  for(let i=0;i<cnt;i++){
    ctx.i=i;const dep=depths?depths[i]:mode;ctx.dep=dep;let q=null;
    for(let t=0;t<40;t++){
      q=g[dep](ctx);
      const k=dep+'|'+q.key,cap=q.cap||1;
      if((used[k]||0)<cap){used[k]=(used[k]||0)+1;break;}
      if(t===39){used[k]=(used[k]||0)+1;}
    }
    out.push(Object.assign(q,{F:true,q:q.prompt,a:String(q.answer),st:{tries:0,done:false,correct:false,wrong:[]}}));
  }
  return out;
}
/* a set should not give the same answer every time, so ask again until the answers vary */
function genSetF(topic,mode,cnt){
  let out=null,cur=null;
  for(let t=0;t<80;t++){
    out=genSetOnce(topic,mode,cnt);
    cur=Object.assign({},FworkedCursor);
    out=Finject(topic,out,cur);
    if(mode==='mixed'||FTOPICS[topic]==='comparing')break;
    if(new Set(out.map(q=>q.a)).size>=Math.min(3,cnt))break;
  }
  Object.assign(FworkedCursor,cur);
  return out;
}

function fTurn(v){

function fCompareGroups(v){

function fEl(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)setHTML(e, html);return e;}
function fSay(kind){

/* the common answer step: right or wrong, retry once, then show the answer */
function fJudge(right,wrongKey){

  if(right){st.done=true;st.correct=st.tries===0;fSay('good');}

function fDragify(el,onDrop,onTap){

    if(e.button>0)return;
    const sx=e.clientX,sy=e.clientY;let ghost=null,moved=false;
    const mv=ev=>{
      if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){moved=true;ghost=fEl('div','fghost');document.body.appendChild(ghost);}
      if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';
        document.querySelectorAll('[data-drop]').forEach(t=>t.classList.remove('fover'));
        const u=document.elementFromPoint(ev.clientX,ev.clientY),t=u&&u.closest('[data-drop]');if(t)t.classList.add('fover');}
    };

      document.querySelectorAll('[data-drop]').forEach(t=>t.classList.remove('fover'));
      if(ghost){ghost.remove();const u=document.elementFromPoint(ev.clientX,ev.clientY),t=u&&u.closest('[data-drop]');

function fItems(v){

function fCountArea(q){
  const L=fItems(q.visual),pad=8,W=L.w+2*pad,H=L.h+2*pad;q.ui=q.ui||{tapped:[]};
  const box=fEl('div','fcount');box.style.aspectRatio=W+' / '+H;
  const need=L.it.filter(i=>i.tg).length;let order=0;
  L.it.forEach((it,k)=>{
    const done=q.ui.tapped.indexOf(k)>=0;
    const b=fEl(it.tg?'button':'span','fitem'+(it.sh==='s'?' sq':'')+(done?' tapped':'')+(it.tg?'':' dim'));
    if(it.tg)b.type='button';
    b.style.left=((it.x+pad)/W*100)+'%';b.style.top=((it.y+pad)/H*100)+'%';
    if(it.tg){
      b.setAttribute('aria-label',done?'Counted':'Counter, not counted yet');
      if(done){b.disabled=true;setHTML(b, '<span>'+(q.depth==='starter'?(q.ui.tapped.indexOf(k)+1):'✓')+'</span>');}
      else b.onclick=()=>{q.ui.tapped.push(k);fFocus='item';renderF();};
    }

  /* keep every tap target at least 48 px and clear of its neighbours: the picture is kept as drawn unless two items would overlap, then they are nudged apart (sideways first, the area grows taller) */

    const inner=w-48,D=48.5,n=L.it.length;let sx=inner/L.w;
    /* tidy rows (a line, or rows of five): widen the spacing about the middle so neighbours clear each other */
    const tidy=q.visual.kind==='rowsOf5'||q.visual.layout==='line';
    if(tidy){
      const xs=L.it.map(i=>i.x),span=Math.max(...xs)-Math.min(...xs);let pitch=1e9;
      for(let a=0;a<xs.length;a++)for(let b=a+1;b<xs.length;b++){const g=Math.abs(xs[a]-xs[b]);if(g>0.01)pitch=Math.min(pitch,g);}
      if(pitch<1e8&&span>0){let t=Math.max(sx,D/pitch);if(span*t>inner)t=Math.max(sx,inner/span);sx=t;}
    }
    const mid=tidy?(Math.max(...L.it.map(i=>i.x))+Math.min(...L.it.map(i=>i.x)))/2:L.w/2;
    const X=L.it.map(i=>inner/2+(i.x-mid)*sx),Y=L.it.map(i=>i.y*(tidy?1:sx));

        if(px<=py*0.8){const sg=dx>0?1:(dx<0?-1:(j%2?1:-1)),m=px/2+0.05;X[i]-=sg*m;X[j]+=sg*m;}
        else{const sg=dy>0?1:(dy<0?-1:(j%2?1:-1)),m=py/2+0.05;Y[i]-=sg*m;Y[j]+=sg*m;}
        moved=true;
      }
      for(let i=0;i<n;i++)X[i]=Math.max(0,Math.min(inner,X[i]));
      if(!moved)break;
    }
    const clash=()=>{for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(Math.abs(X[i]-X[j])<D-0.6&&Math.abs(Y[i]-Y[j])<D-0.6)return true;return false;};
    if(clash()){                                       /* rare: tidy grid in reading order (top to bottom, then left to right) */

function saveEntryF(){
  if(qs.length&&qs[0].G)return saveEntryG();
  const set=m=>{qs.saveMsg=m;const e=document.getElementById('expStatus');if(e)e.textContent=m;};
  if(!qs.length||!qs.every(q=>q.st&&q.st.done))return false;       /* only a finished set is saved */
  const kid=children.find(c=>c.id===curChild);
  if(!kid||curChild==='ALL'){set('Not saved yet. Pick one child above, then finish the set again.');return false;}
  try{
    const mode=document.getElementById('qDepth').value,depth=F_DEPTH[mode]||'Practice';
    const total=qs.length,right=qs.filter(q=>q.st.correct).length,first=fFirstName(kid.name);
    const title='Maths Foundation — '+curTopic;
    const summary=first+' practised '+F_SKILL[curTopic]+' at '+depth+' depth and answered '+right+' of '+total+' questions correctly on the first try.';
    const dateEl=document.getElementById('entryDate'),date=dateEl&&dateEl.value?dateEl.value:new Date().toISOString().slice(0,10);
    const refl=(document.getElementById('refl').value||'').trim().slice(0,1000);
    const now=new Date().toISOString();
    let entries=loadE();if(!Array.isArray(entries))entries=[];
    const tag='depth-'+mode;
    let ex=entries.find(e=>e.title===title&&e.date===date&&(e.tags||[]).indexOf(tag)>=0);
    const ev=[{type:'workSample',note:total+' questions, '+right+' correct on first try'}];
    if(refl)ev.push({type:'reflection'});
    const entry={entryId:ex?ex.entryId:'maths-teach-do:e_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),date,title,summary,
      description:total+' questions at '+depth+' depth, answered by tapping or dragging.',
      curriculum:[{kind:'learningArea',area:'Mathematics',path:['Number'],label:'Mathematics > Number'},{kind:'generalCapability',area:'Numeracy',label:'Numeracy'}],
      evidenceTypes:ev,photos:[],tags:['foundation',tag],createdAt:ex?ex.createdAt:now,updatedAt:now};
    if(refl)entry.reflection=refl;
    if(fDurTouched){const d=parseInt(document.getElementById('dur').value,10);if(d>=1&&d<=600)entry.durationMinutes=d;}
    if(ex)entries[entries.indexOf(ex)]=entry;else entries.push(entry);
    saveE(entries);
    /* read it back before saying it is saved */
    const back=loadE().find(e=>e.entryId===entry.entryId);
    if(!back||back.summary!==summary||back.updatedAt!==now){set('Could not save. This device may be out of storage or blocking it.');return false;}
    renderLog();
    set('Saved to the evidence log for '+first+'.');
    return true;
  }catch(err){
    console.error('saveEntryF error',err);
    set('Could not save. This device may be out of storage or blocking it.');
    return false;
  }
}

    });
  };
  return {need:P.length,all:q.ui.tapped.length>=P.length};
}
function gPicture(q){
  const v=q.visual,box=fEl('div','gpic gtaps');
  if(v.k==='silhouette'){box.classList.add('gscale');box.style.width='min(100%,230px)';}
  else box.style.width='min(100%,'+gPicWidth(v)+'px)';
  setHTML(box, gSvg(v,v.l,false));
  let info={need:0,all:true};
  if(q.type==='count-and-tap'&&q.tp)info=gTapLayer(q,box,v);
  else box.classList.remove('gtaps');
  return {el:box,info};
}
function gCards(q){
  const cs=q.cards,scale=!!(q.visual&&q.visual.k==='silhouette');
  const mx=Math.max(...cs.map(c=>(c.w+4)/(c.h+4))),w=fEl('div','fcards'+(scale?' gscale':(mx>1.5?' one':'')));
  cs.forEach((c,i)=>{
    const wr=q.st.wrong.indexOf(i)>=0,rt=q.st.done&&i===q.answer;
    const b=fEl('button','fcard-btn'+(wr?' wrong':'')+(rt?' right':''),gSvg(c,'',true));b.type='button';
    b.setAttribute('aria-label','Picture card '+(i+1));b.disabled=wr||q.st.done;b.onclick=()=>fJudge(i===q.answer,i);w.appendChild(b);
  });
  return w;
}
function renderG(){
  const pp=document.getElementById('practicePane'),P=document.getElementById('fPane');
  pp.classList.add('isF');
  document.getElementById('prog').textContent='';document.getElementById('score').textContent='';
  const q=qs[qi];if(!q){setHTML(P, '');return;}
  const st=q.st;setHTML(P, '');
  if(!P._gk){P._gk=1;P.addEventListener('keydown',e=>{
    if(!/^Arrow(Right|Down|Left|Up)$/.test(e.key))return;
    const g=e.target.closest&&e.target.closest('.fnums,.fcards,.gtaps');if(!g)return;
    const els=[].slice.call(g.querySelectorAll('button:not(:disabled)')),i=els.indexOf(e.target);if(i<0)return;
    e.preventDefault();const n=(e.key==='ArrowRight'||e.key==='ArrowDown')?i+1:i-1;if(els[n])els[n].focus();
  });}
  P.appendChild(fEl('p','fparent',G_DATA.parent));
  P.insertAdjacentHTML('beforeend',fProgress());
  if(qs.fin){P.appendChild(fDonePanel());return;}
  const card=fEl('div','fcard');
  card.appendChild(fEl('div','fprompt',gEsc(q.prompt)));
  let ans=null,pic=null;
  const v=q.visual;
  if(v){
    const vis=fEl('div','fvis');
    if(v.k==='numeral'){const n=fEl('div','fnumeral',String(v.n));n.setAttribute('role','img');n.setAttribute('aria-label','The number '+v.n);vis.appendChild(n);}
    else{pic=gPicture(q);vis.appendChild(pic.el);}
    card.appendChild(vis);
  }
  if(q.type==='match-card')ans=gCards(q);
  else ans=fNumBtns(q,q.type==='count-and-tap'&&pic&&!pic.info.all&&!st.done);
  if(q.type==='count-and-tap'&&pic&&!pic.info.all&&!st.done)card.dataset.need='1';
  card.appendChild(ans);
  if(card.dataset.need)card.appendChild(fEl('div','fhint','Touch each one once, then pick the number.'));
  const fb=fEl('div','ffb');fb.setAttribute('role','status');fb.setAttribute('aria-live','polite');
  if(st.msg){
    if(st.msgKind==='good')setHTML(fb, '<span class="fpop fstar"><svg viewBox="0 0 24 24" class="fstar"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.2 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z" fill="var(--brass)" stroke="var(--walnut)" stroke-width="1.6" stroke-linejoin="round"/></svg></span>');
    fb.appendChild(document.createTextNode(st.msg));
  }
  card.appendChild(fb);
  const act=fEl('div','fact');
  if(st.done){
    const last=qi>=qs.length-1;
    const nx=fEl('button','fnext',last?'Finish':'Next');nx.type='button';nx.dataset.k='next';
    nx.onclick=()=>{if(last){qs.fin=true;fFocus=null;renderF();}else{qi++;fFocus='first';renderF();}};
    act.appendChild(nx);
  }
  card.appendChild(act);
  P.appendChild(card);
  P.querySelectorAll('.gpic').forEach(b=>b._layout&&b._layout());
  const ff=fFocus;
  setTimeout(()=>{
    let el=null;
    if(ff==='next')el=P.querySelector('[data-k="next"]');
    else if(ff==='item')el=P.querySelector('.gtap:not(:disabled)')||P.querySelector('.fnums .fbtn:not(:disabled)');
    else if(ff==='first')el=P.querySelector('.gtap:not(:disabled),.fbtn:not(:disabled),.fcard-btn:not(:disabled)');
    if(el&&!el.disabled)el.focus({preventScroll:true});
  },0);
  fFocus=null;
}
window.addEventListener('resize',()=>document.querySelectorAll('#fPane .gpic').forEach(b=>b._layout&&b._layout()));
/* ---- evidence ---- */
function saveEntryG(){
  const set=m=>{qs.saveMsg=m;const e=document.getElementById('expStatus');if(e)e.textContent=m;};
  if(!qs.length||!qs.every(q=>q.st&&q.st.done))return false;       /* only a finished set is saved */
  const kid=children.find(c=>c.id===curChild);
  if(!kid||curChild==='ALL'){set('Not saved yet. Pick one child above, then finish the set again.');return false;}
  try{
    const mode=document.getElementById('qDepth').value,depth=F_DEPTH[mode]||'Practice',t=gTopic();
    const total=qs.length,right=qs.filter(q=>q.st.correct).length,first=fFirstName(kid.name);
    const title='Maths Shapes and space — '+curTopic;
    const summary=first+' practised '+t.skill+' at '+depth+' depth and answered '+right+' of '+total+' questions correctly on the first try.';
    const dateEl=document.getElementById('entryDate'),date=dateEl&&dateEl.value?dateEl.value:new Date().toISOString().slice(0,10);
    const refl=(document.getElementById('refl').value||'').trim().slice(0,1000);
    const now=new Date().toISOString();
    let entries=loadE();if(!Array.isArray(entries))entries=[];
    const tag='depth-'+mode;
    /* a second finished set the same day is its own entry. */
    let ex=qs.savedId?entries.find(e=>e.entryId===qs.savedId):null;
    const ev=[{type:'workSample',note:total+' questions, '+right+' correct on first try'}];
    if(refl)ev.push({type:'reflection'});
    const entry={entryId:ex?ex.entryId:'maths-teach-do:e_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),date,title,summary,
      description:total+' questions at '+depth+' depth, answered by tapping.',
      curriculum:[{kind:'learningArea',area:'Mathematics',path:['Space'],label:'Mathematics > Space'},{kind:'generalCapability',area:'Numeracy',label:'Numeracy'}],
      evidenceTypes:ev,photos:[],tags:['shapes-and-space',tag],createdAt:ex?ex.createdAt:now,updatedAt:now};
    if(refl)entry.reflection=refl;
    if(fDurTouched){const d=parseInt(document.getElementById('dur').value,10);if(d>=1&&d<=600)entry.durationMinutes=d;}
    if(ex)entries[entries.indexOf(ex)]=entry;else entries.push(entry);
    saveE(entries);
    /* read it back before saying it is saved */
    const back=loadE().find(e=>e.entryId===entry.entryId);
    if(!back||back.summary!==summary||back.updatedAt!==now){set('Could not save. This device may be out of storage or blocking it.');return false;}
    qs.savedId=entry.entryId;
    renderLog();
    set('Saved to the evidence log for '+first+'.');
    return true;
  }catch(err){
    console.error('saveEntryG error',err);
    set('Could not save. This device may be out of storage or blocking it.');
    return false;
  }
}

document.getElementById('entryDate').valueAsDate=new Date();
renderChildBar();renderYear();renderTopics();renderLearn();newQs();renderLog();
